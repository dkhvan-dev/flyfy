    volumes:
      - ./init-scripts/010_payment_service_migrate.sh:/usr/local/bin/010_payment_service_migrate.sh:ro
      - ../backend/services/payment-service/migrations:/migrations/payment-service:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/010_payment_service_migrate.sh"]
    depends_on:
      payment-postgres:
        condition: service_healthy
