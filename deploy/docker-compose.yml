services:
  # ============================================
  # Token Service PostgreSQL
  # ============================================
  token-postgres:
    image: postgres:17-alpine
    container_name: token-postgres
    environment:
      POSTGRES_DB: token_service
      POSTGRES_USER: token_service
      POSTGRES_PASSWORD: token_secret_dev
    ports:
      - "5432:5432"
    volumes:
      - token_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/001_token_service.sh:/docker-entrypoint-initdb.d/001_token_service.sh
      - ../backend/services/token-service/migrations:/migrations/token-service:ro
      - ./init-scripts/001_token_service_seed_services.sh:/docker-entrypoint-initdb.d/001_token_service_seed_services.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U token_service -d token_service"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - flyfy-network

  token-postgres-migrator:
    image: postgres:17-alpine
    container_name: token-postgres-migrator
    environment:
      PGHOST: token-postgres
      PGPORT: 5432
      POSTGRES_DB: token_service
      POSTGRES_USER: token_service
      POSTGRES_PASSWORD: token_secret_dev
    volumes:
      - ./init-scripts/001_token_service_migrate.sh:/usr/local/bin/001_token_service_migrate.sh:ro
      - ../backend/services/token-service/migrations:/migrations/token-service:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/001_token_service_migrate.sh"]
    depends_on:
      token-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - flyfy-network

  # ============================================
  # Auth Service PostgreSQL
  # ============================================
  auth-postgres:
    image: postgres:17-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_service
      POSTGRES_PASSWORD: auth_secret_dev
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/002_auth_service.sh:/docker-entrypoint-initdb.d/002_auth_service.sh
      - ../backend/services/auth-service/migrations:/migrations/auth-service:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_service -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - flyfy-network

  # ============================================
  # File Manager PostgreSQL
  # ============================================
  file-manager-postgres:
    image: postgres:17-alpine
    container_name: file-manager-postgres
    environment:
      POSTGRES_DB: file_manager_db
      POSTGRES_USER: file_manager
      POSTGRES_PASSWORD: file_manager_secret_dev
    ports:
      - "5435:5432"
    volumes:
      - file_manager_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/003_file_manager.sh:/docker-entrypoint-initdb.d/003_file_manager.sh
      - ../backend/services/file-manager-service/migrations:/migrations/file-manager-service:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U file_manager -d file_manager_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - flyfy-network

  # ============================================
  # User Service PostgreSQL
  # ============================================
  user-postgres:
    image: postgres:17-alpine
    container_name: user-postgres
    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_secret_dev
    ports:
      - "5436:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/004_user_service.sh:/docker-entrypoint-initdb.d/004_user_service.sh
      - ../backend/services/user-service/migrations:/migrations/user-service:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d user_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - flyfy-network

  user-postgres-migrator:
    image: postgres:17-alpine
    container_name: user-postgres-migrator
    environment:
      PGHOST: user-postgres
      PGPORT: 5432
      POSTGRES_DB: user_service_db
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_secret_dev
    volumes:
      - ./init-scripts/004_user_service_migrate.sh:/usr/local/bin/004_user_service_migrate.sh:ro
      - ../backend/services/user-service/migrations:/migrations/user-service:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/004_user_service_migrate.sh"]
    depends_on:
      user-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - flyfy-network

  # ============================================
  # Guide Service PostgreSQL
  # ============================================
  guide-postgres:
    image: postgres:17-alpine
    container_name: guide-postgres
    environment:
      POSTGRES_DB: guide_service_db
      POSTGRES_USER: guide_service
      POSTGRES_PASSWORD: guide_secret_dev
    ports:
      - "5437:5432"
    volumes:
      - guide_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/005_guide_service.sh:/docker-entrypoint-initdb.d/005_guide_service.sh
      - ../backend/services/guide-service/migrations:/migrations/guide-service:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guide_service -d guide_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - flyfy-network

  # ============================================
  # Activity PostgreSQL
  # ============================================
  activity-postgres:
    image: postgres:17-alpine
    container_name: activity-postgres
    environment:
      POSTGRES_DB: activity_service_db
      POSTGRES_USER: activity_service
      POSTGRES_PASSWORD: activity_secret_dev
    ports:
      - "5438:5432"
    volumes:
      - activity_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/006_activity_service.sh:/docker-entrypoint-initdb.d/006_activity_service.sh
      - ../backend/services/activity-service/migrations:/migrations/activity-service:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activity_service -d activity_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - flyfy-network

  activity-postgres-migrator:
    image: postgres:17-alpine
    container_name: activity-postgres-migrator
    environment:
      PGHOST: activity-postgres
      PGPORT: 5432
      POSTGRES_DB: activity_service_db
      POSTGRES_USER: activity_service
      POSTGRES_PASSWORD: activity_secret_dev
    volumes:
      - ./init-scripts/006_activity_service_migrate.sh:/usr/local/bin/006_activity_service_migrate.sh:ro
      - ../backend/services/activity-service/migrations:/migrations/activity-service:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/006_activity_service_migrate.sh"]
    depends_on:
      activity-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - flyfy-network

  # ============================================
  # Stories PostgreSQL
  # ============================================
  stories-postgres:
    image: postgres:17-alpine
    container_name: stories-postgres
    environment:
      POSTGRES_DB: stories_service_db
      POSTGRES_USER: stories_service
      POSTGRES_PASSWORD: stories_secret_dev
    ports:
      - "5439:5432"
    volumes:
      - stories_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/007_stories_service.sh:/docker-entrypoint-initdb.d/007_stories_service.sh
      - ../backend/services/stories-service/migrations:/migrations/stories-service:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stories_service -d stories_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - flyfy-network

  stories-postgres-migrator:
    image: postgres:17-alpine
    container_name: stories-postgres-migrator
    environment:
      PGHOST: stories-postgres
      PGPORT: 5432
      POSTGRES_DB: stories_service_db
      POSTGRES_USER: stories_service
      POSTGRES_PASSWORD: stories_secret_dev
    volumes:
      - ./init-scripts/007_stories_service_migrate.sh:/usr/local/bin/007_stories_service_migrate.sh:ro
      - ../backend/services/stories-service/migrations:/migrations/stories-service:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/007_stories_service_migrate.sh"]
    depends_on:
      stories-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - flyfy-network

  # ============================================
  # Chat Service PostgreSQL
  # ============================================
  chat-postgres:
    image: postgres:17-alpine
    container_name: chat-postgres
    environment:
      POSTGRES_DB: chat_service_db
      POSTGRES_USER: chat_service
      POSTGRES_PASSWORD: chat_secret_dev
    ports:
      - "5440:5432"
    volumes:
      - chat_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/008_chat_service.sh:/docker-entrypoint-initdb.d/008_chat_service.sh
      - ../backend/services/chat-service/migrations:/migrations/chat-service:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_service -d chat_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - flyfy-network

  chat-postgres-migrator:
    image: postgres:17-alpine
    container_name: chat-postgres-migrator
    environment:
      PGHOST: chat-postgres
      PGPORT: 5432
      POSTGRES_DB: chat_service_db
      POSTGRES_USER: chat_service
      POSTGRES_PASSWORD: chat_secret_dev
    volumes:
      - ./init-scripts/008_chat_service_migrate.sh:/usr/local/bin/008_chat_service_migrate.sh:ro
      - ../backend/services/chat-service/migrations:/migrations/chat-service:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/008_chat_service_migrate.sh"]
    depends_on:
      chat-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - flyfy-network

  # ============================================
  # NATS
  # ============================================
  nats:
    image: nats:2
    container_name: flyfy-nats
    command: --jetstream --store_dir /data -m 8222
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      # The official nats:2 image is minimal and does not ship wget/curl.
      # Use the bundled nats-server binary to probe the main process instead.
      test: ["CMD", "/nats-server", "--signal", "reload=1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - flyfy-network

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: flyfy-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - flyfy-network

  # ============================================
  # File Manager MinIO
  # ============================================
  file-manager-minio:
    image: minio/minio:latest
    container_name: file-manager-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: flyfy
      MINIO_ROOT_PASSWORD: flyfysecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - file_manager_minio_data:/data
    restart: unless-stopped
    networks:
      - flyfy-network

  # ============================================
  # File Manager MinIO Init
  # ============================================
  file-manager-minio-init:
    image: minio/mc:latest
    container_name: file-manager-minio-init
    depends_on:
      file-manager-minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://file-manager-minio:9000 flyfy flyfysecret;
      mc mb -p local/flyfy-files || true;
      mc anonymous set private local/flyfy-files || true;
      exit 0;
      "
    networks:
      - flyfy-network

  # ============================================
  # Token Service
  # ============================================
  token-service:
    build:
      context: ..
      dockerfile: ./backend/services/token-service/Dockerfile
    container_name: token-service
    ports:
      - "50051:50051"
      - "8081:8081"
    environment:
      APP_ENV: development
      GRPC_PORT: 50051
      HTTP_PORT: 8081

      JWT_ISSUER: tourism-superapp/token-service
      JWT_ACCESS_TTL: 30m
      JWT_REFRESH_TTL: 720h
      JWT_SERVICE_TTL: 1h
      JWT_PRIVATE_KEY_PATH: /var/lib/flyfy/token-service/signing-keys.json

      PG_HOST: token-postgres
      PG_PORT: 5432
      PG_USER: token_service
      PG_PASSWORD: token_secret_dev
      PG_DBNAME: token_service
      PG_SSLMODE: disable

      REDIS_ADDR: redis:6379
    volumes:
      - token_service_keys:/var/lib/flyfy/token-service
    depends_on:
      token-postgres:
        condition: service_healthy
      token-postgres-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - flyfy-network

  # ============================================
  # Auth Service
  # ============================================
  auth-service:
    build:
      context: ..
      dockerfile: ./backend/services/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "50052:50052"
      - "8082:8082"
    environment:
      APP_ENV: development
      GRPC_PORT: 50052
      HTTP_PORT: 8082

      PG_HOST: auth-postgres
      PG_PORT: 5432
      PG_USER: auth_service
      PG_PASSWORD: auth_secret_dev
      PG_DBNAME: auth_db
      PG_SSLMODE: disable

      REDIS_ADDR: redis:6379
      REDIS_DB: 1

      TOKEN_SERVICE_ADDR: token-service:50051
      TOKEN_SERVICE_ID: auth-service
      TOKEN_SERVICE_SECRET: auth-service-secret

      OTP_LENGTH: 6
      OTP_TTL: 5m
      OTP_MAX_ATTEMPTS: 5
    depends_on:
      auth-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      token-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - flyfy-network

  # ============================================
  # File Manager Service
  # ============================================
  file-manager-service:
    build:
      context: ..
      dockerfile: ./backend/services/file-manager-service/Dockerfile
    container_name: file-manager-service
    depends_on:
      file-manager-postgres:
        condition: service_healthy
      file-manager-minio-init:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
      - "9093:9093"
    environment:
      APP_ENV: development
      HTTP_PORT: 8083
      GRPC_PORT: 9093

      POSTGRES_HOST: file-manager-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: file_manager
      POSTGRES_PASSWORD: file_manager_secret_dev
      POSTGRES_DB: file_manager_db
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_OPEN_CONNS: 10
      POSTGRES_MIN_OPEN_CONNS: 2
      POSTGRES_MAX_CONN_LIFETIME: 1h
      POSTGRES_MAX_CONN_IDLE_TIME: 30m

      STORAGE_PROVIDER: s3
      STORAGE_ENDPOINT: http://file-manager-minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: flyfy
      STORAGE_SECRET_ACCESS_KEY: flyfysecret
      STORAGE_BUCKET: flyfy-files
      STORAGE_USE_PATH_STYLE: "true"
      STORAGE_PRESIGN_TTL: 15m
      STORAGE_MAX_UPLOAD_SIZE_BYTES: 26214400

      LOG_LEVEL: debug

      INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      REQUIRE_AUTHENTICATED_WRITES: "true"
      TRUSTED_GATEWAY_HEADER_USER_ID: X-User-Id
      TRUSTED_GATEWAY_HEADER_ROLES: X-User-Roles
      TRUSTED_GATEWAY_HEADER_SUB: X-Auth-Subject
      REQUEST_ID_HEADER: X-Request-Id
    restart: unless-stopped
    networks:
      - flyfy-network

  # ============================================
  # User Service
  # ============================================
  user-service:
    build:
      context: ..
      dockerfile: ./backend/services/user-service/Dockerfile
    container_name: user-service
    depends_on:
      user-postgres:
        condition: service_healthy
      user-postgres-migrator:
        condition: service_completed_successfully
      file-manager-service:
        condition: service_started
    ports:
      - "8084:8084"
      - "9094:9094"
    environment:
      APP_ENV: development
      HTTP_PORT: 8084
      HTTP_READ_TIMEOUT: 15s
      HTTP_WRITE_TIMEOUT: 15s
      HTTP_IDLE_TIMEOUT: 60s
      GRPC_PORT: 9094

      POSTGRES_HOST: user-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_secret_dev
      POSTGRES_DB: user_service_db
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_OPEN_CONNS: 10
      POSTGRES_MIN_OPEN_CONNS: 2
      POSTGRES_MAX_CONN_LIFETIME: 1h
      POSTGRES_MAX_CONN_IDLE_TIME: 30m

      LOG_LEVEL: debug

      INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      REQUIRE_AUTHENTICATED_WRITES: "true"
      TRUSTED_GATEWAY_HEADER_USER_ID: X-User-Id
      TRUSTED_GATEWAY_HEADER_ROLES: X-User-Roles
      TRUSTED_GATEWAY_HEADER_SUB: X-Auth-Subject
      REQUEST_ID_HEADER: X-Request-Id

      FILE_MANAGER_GRPC_TARGET: dns:///file-manager-service:9093
    restart: unless-stopped
    networks:
      - flyfy-network

  # ============================================
  # Guide Service
  # ============================================
  guide-service:
    build:
      context: ..
      dockerfile: ./backend/services/guide-service/Dockerfile
    container_name: guide-service
    depends_on:
      guide-postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      file-manager-service:
        condition: service_started
    ports:
      - "8085:8085"
      - "9095:9095"
    environment:
      APP_ENV: development
      HTTP_PORT: 8085
      HTTP_READ_TIMEOUT: 15s
      HTTP_WRITE_TIMEOUT: 15s
      HTTP_IDLE_TIMEOUT: 60s
      GRPC_PORT: 9095

      POSTGRES_HOST: guide-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: guide_service
      POSTGRES_PASSWORD: guide_secret_dev
      POSTGRES_DB: guide_service_db
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_OPEN_CONNS: 10
      POSTGRES_MIN_OPEN_CONNS: 2
      POSTGRES_MAX_CONN_LIFETIME: 1h
      POSTGRES_MAX_CONN_IDLE_TIME: 30m

      LOG_LEVEL: info

      INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      REQUIRE_AUTHENTICATED_WRITES: "true"
      TRUSTED_GATEWAY_HEADER_USER_ID: X-User-Id
      TRUSTED_GATEWAY_HEADER_ROLES: X-User-Roles
      TRUSTED_GATEWAY_HEADER_SUB: X-Auth-Subject
      REQUEST_ID_HEADER: X-Request-Id

      USER_SERVICE_GRPC_TARGET: dns:///user-service:9094
      FILE_MANAGER_GRPC_TARGET: dns:///file-manager-service:9093
    restart: unless-stopped
    networks:
      - flyfy-network
  
  # ============================================
  # Activity Service
  # ============================================
  activity-service:
    build:
      context: ..
      dockerfile: ./backend/services/activity-service/Dockerfile
    container_name: activity-service
    depends_on:
      activity-postgres:
        condition: service_healthy
      activity-postgres-migrator:
        condition: service_completed_successfully
      payment-service:
        condition: service_started
    ports:
      - "8086:8086"
      - "9096:9096"
    environment:
      APP_NAME: activity-service
      APP_ENV: development

      HTTP_PORT: 8086
      GRPC_PORT: 9096

      DB_HOST: activity-postgres
      DB_PORT: 5432
      DB_NAME: activity_service_db
      DB_USER: activity_service
      DB_PASSWORD: activity_secret_dev
      DB_SSLMODE: disable
      DB_MAX_CONNS: 10
      DB_MIN_CONNS: 2
      DB_MAX_CONN_IDLE: 15m
      DB_MAX_CONN_LIFETIME: 1h

      LOG_LEVEL: debug

      INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      REQUIRE_AUTHENTICATED_WRITES: "true"
      TRUSTED_GATEWAY_HEADER_USER_ID: X-User-Id
      TRUSTED_GATEWAY_HEADER_ROLES: X-User-Roles
      TRUSTED_GATEWAY_HEADER_SUB: X-Auth-Subject
      REQUEST_ID_HEADER: X-Request-Id

      USER_SERVICE_GRPC_ADDR: dns:///user-service:9094
      CHAT_SERVICE_HTTP_URL: http://chat-service:8088
      CHAT_SERVICE_REQUEST_TIMEOUT: 5s
      PAYMENT_SERVICE_HTTP_URL: http://payment-service:8091
      PAYMENT_SERVICE_REQUEST_TIMEOUT: 5s
    restart: unless-stopped
    networks:
      - flyfy-network

  # ============================================
  # Stories Service
  # ============================================
  stories-service:
    build:
      context: ..
      dockerfile: ./backend/services/stories-service/Dockerfile
    container_name: stories-service
    depends_on:
      stories-postgres:
        condition: service_healthy
      stories-postgres-migrator:
        condition: service_completed_successfully
      user-service:
        condition: service_started
    ports:
      - "8087:8087"
    environment:
      APP_ENV: development
      HTTP_PORT: 8087
      HTTP_READ_TIMEOUT: 15s
      HTTP_WRITE_TIMEOUT: 15s
      HTTP_IDLE_TIMEOUT: 60s

      POSTGRES_HOST: stories-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: stories_service
      POSTGRES_PASSWORD: stories_secret_dev
      POSTGRES_DB: stories_service_db
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_OPEN_CONNS: 10
      POSTGRES_MIN_OPEN_CONNS: 2
      POSTGRES_MAX_CONN_LIFETIME: 1h
      POSTGRES_MAX_CONN_IDLE_TIME: 30m

      LOG_LEVEL: info

      INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      REQUIRE_AUTHENTICATED_WRITES: "true"
      TRUSTED_GATEWAY_HEADER_USER_ID: X-User-Id
      TRUSTED_GATEWAY_HEADER_ROLES: X-User-Roles
      TRUSTED_GATEWAY_HEADER_SUB: X-Auth-Subject
      REQUEST_ID_HEADER: X-Request-Id

      USER_SERVICE_GRPC_TARGET: dns:///user-service:9094
      STORIES_BASE_URL: https://flyfy.app/stories
    restart: unless-stopped
    networks:
      - flyfy-network

  # ============================================
  # Chat Service
  # ============================================
  chat-service:
    build:
      context: ..
      dockerfile: ./backend/services/chat-service/Dockerfile
    container_name: chat-service
    depends_on:
      chat-postgres:
        condition: service_healthy
      chat-postgres-migrator:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      activity-service:
        condition: service_started
    ports:
      - "8088:8088"
      - "9097:9097"
    environment:
      APP_NAME: chat-service
      APP_ENV: development

      HTTP_PORT: 8088
      HTTP_READ_TIMEOUT: 15s
      HTTP_WRITE_TIMEOUT: 120s
      HTTP_IDLE_TIMEOUT: 120s
      GRPC_PORT: 9097

      DB_HOST: chat-postgres
      DB_PORT: 5432
      DB_NAME: chat_service_db
      DB_USER: chat_service
      DB_PASSWORD: chat_secret_dev
      DB_SSLMODE: disable
      DB_MAX_CONNS: 50
      DB_MIN_CONNS: 5

      LOG_LEVEL: debug

      INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      REQUIRE_AUTHENTICATED_WRITES: "true"
      TRUSTED_GATEWAY_HEADER_USER_ID: X-User-Id
      TRUSTED_GATEWAY_HEADER_ROLES: X-User-Roles
      TRUSTED_GATEWAY_HEADER_SUB: X-Auth-Subject
      REQUEST_ID_HEADER: X-Request-Id

      NATS_URL: nats://nats:4222

      REDIS_ADDR: redis:6379
      REDIS_DB: 2

      USER_SERVICE_GRPC_ADDR: dns:///user-service:9094
      ACTIVITY_SERVICE_GRPC_ADDR: dns:///activity-service:9096
    restart: unless-stopped
    networks:
      - flyfy-network

  # ============================================
  # Attraction PostgreSQL
  # ============================================
  attraction-postgres:
    image: postgres:17-alpine
    container_name: attraction-postgres
    environment:
      POSTGRES_DB: attraction_service_db
      POSTGRES_USER: attraction_service
      POSTGRES_PASSWORD: attraction_secret_dev
    ports:
      - "5441:5432"
    volumes:
      - attraction_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/009_attraction_service.sh:/docker-entrypoint-initdb.d/009_attraction_service.sh
      - ../backend/services/attraction-service/migrations:/migrations/attraction-service:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attraction_service -d attraction_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - flyfy-network

  attraction-postgres-migrator:
    image: postgres:17-alpine
    container_name: attraction-postgres-migrator
    environment:
      PGHOST: attraction-postgres
      PGPORT: 5432
      POSTGRES_DB: attraction_service_db
      POSTGRES_USER: attraction_service
      POSTGRES_PASSWORD: attraction_secret_dev
    volumes:
      - ./init-scripts/009_attraction_service_migrate.sh:/usr/local/bin/009_attraction_service_migrate.sh:ro
      - ../backend/services/attraction-service/migrations:/migrations/attraction-service:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/009_attraction_service_migrate.sh"]
    depends_on:
      attraction-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - flyfy-network

  # ============================================
  # Payment PostgreSQL
  # ============================================
  payment-postgres:
    image: postgres:17-alpine
    container_name: payment-postgres
    environment:
      POSTGRES_DB: payment_service_db
      POSTGRES_USER: payment_service
      POSTGRES_PASSWORD: payment_secret_dev
    ports:
      - "5442:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/010_payment_service.sh:/docker-entrypoint-initdb.d/010_payment_service.sh
      - ../backend/services/payment-service/migrations:/migrations/payment-service:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_service -d payment_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - flyfy-network

  payment-postgres-migrator:
    image: postgres:17-alpine
    container_name: payment-postgres-migrator
    environment:
      PGHOST: payment-postgres
      PGPORT: 5432
      POSTGRES_DB: payment_service_db
      POSTGRES_USER: payment_service
      POSTGRES_PASSWORD: payment_secret_dev
    volumes:
      - ./init-scripts/010_payment_service_migrate.sh:/usr/local/bin/010_payment_service_migrate.sh:ro
      - ../backend/services/payment-service/migrations:/migrations/payment-service:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/010_payment_service_migrate.sh"]
    depends_on:
      payment-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - flyfy-network

  # ============================================
  # Attraction Service
  # ============================================
  attraction-service:
    build:
      context: ..
      dockerfile: ./backend/services/attraction-service/Dockerfile
    container_name: attraction-service
    depends_on:
      attraction-postgres:
        condition: service_healthy
      attraction-postgres-migrator:
        condition: service_completed_successfully
      user-service:
        condition: service_started
    ports:
      - "8090:8090"
    environment:
      APP_NAME: attraction-service
      APP_ENV: development

      HTTP_PORT: 8090
      HTTP_READ_TIMEOUT: 15s
      HTTP_WRITE_TIMEOUT: 15s
      HTTP_IDLE_TIMEOUT: 60s

      POSTGRES_HOST: attraction-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: attraction_service
      POSTGRES_PASSWORD: attraction_secret_dev
      POSTGRES_DB: attraction_service_db
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_CONNS: 10
      POSTGRES_MIN_CONNS: 2

      LOG_LEVEL: info

      INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      REQUIRE_AUTHENTICATED_WRITES: "true"
      TRUSTED_GATEWAY_HEADER_USER_ID: X-User-Id
      TRUSTED_GATEWAY_HEADER_ROLES: X-User-Roles
      TRUSTED_GATEWAY_HEADER_SUB: X-Auth-Subject
      REQUEST_ID_HEADER: X-Request-Id

      USER_SERVICE_GRPC_TARGET: dns:///user-service:9094
    restart: unless-stopped
    networks:
      - flyfy-network

  # ============================================
  # Payment Service
  # ============================================
  payment-service:
    build:
      context: ..
      dockerfile: ./backend/services/payment-service/Dockerfile
    container_name: payment-service
    depends_on:
      payment-postgres:
        condition: service_healthy
      payment-postgres-migrator:
        condition: service_completed_successfully
    ports:
      - "8091:8091"
    environment:
      APP_NAME: payment-service
      APP_ENV: development

      HTTP_PORT: 8091
      HTTP_READ_TIMEOUT: 15s
      HTTP_WRITE_TIMEOUT: 15s
      HTTP_IDLE_TIMEOUT: 60s

      POSTGRES_HOST: payment-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: payment_service
      POSTGRES_PASSWORD: payment_secret_dev
      POSTGRES_DB: payment_service_db
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_OPEN_CONNS: 20
      POSTGRES_MIN_OPEN_CONNS: 2
      POSTGRES_MAX_CONN_LIFETIME: 1h
      POSTGRES_MAX_CONN_IDLE_TIME: 30m

      LOG_LEVEL: info
      PAYMENT_PROVIDER: mock

      INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      REQUIRE_AUTHENTICATED_REQUESTS: "true"
      REQUIRE_AUTHENTICATED_WRITES: "true"
      TRUSTED_GATEWAY_HEADER_USER_ID: X-User-Id
      TRUSTED_GATEWAY_HEADER_ROLES: X-User-Roles
      TRUSTED_GATEWAY_HEADER_SUB: X-Auth-Subject
      REQUEST_ID_HEADER: X-Request-Id
    restart: unless-stopped
    networks:
      - flyfy-network

  # ============================================
  # Reference Service
  # ============================================
  reference-service:
    build:
      context: ..
      dockerfile: ./backend/services/reference-service/Dockerfile
    container_name: reference-service
    ports:
      - "8089:8089"
    environment:
      APP_NAME: reference-service
      APP_ENV: development

      HTTP_PORT: 8089
      HTTP_READ_TIMEOUT: 10s
      HTTP_WRITE_TIMEOUT: 10s
      HTTP_IDLE_TIMEOUT: 60s

      LOG_LEVEL: info
    restart: unless-stopped
    networks:
      - flyfy-network

  # ============================================
  # API Gateway
  # ============================================
  api-gateway:
    build:
      context: ..
      dockerfile: ./backend/services/api-gateway/Dockerfile
    container_name: api-gateway
    depends_on:
      token-service:
        condition: service_started
      auth-service:
        condition: service_started
      file-manager-service:
        condition: service_started
      user-service:
        condition: service_started
      guide-service:
        condition: service_started
      stories-service:
        condition: service_started
      chat-service:
        condition: service_started
      reference-service:
        condition: service_started
      attraction-service:
        condition: service_started
      payment-service:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development

      HTTP_PORT: 8080
      HTTP_READ_TIMEOUT: 15s
      HTTP_WRITE_TIMEOUT: 15s
      HTTP_IDLE_TIMEOUT: 60s

      LOG_LEVEL: info

      REQUEST_ID_HEADER: X-Request-Id
      TRUSTED_HEADER_USER_ID: X-User-Id
      TRUSTED_HEADER_ROLES: X-User-Roles
      TRUSTED_HEADER_SUB: X-Auth-Subject

      API_PREFIX: /api/v1

      AUTH_SERVICE_HTTP_URL: http://auth-service:8082
      USER_SERVICE_HTTP_URL: http://user-service:8084
      GUIDE_SERVICE_HTTP_URL: http://guide-service:8085
      FILE_MANAGER_HTTP_URL: http://file-manager-service:8083
      ACTIVITY_SERVICE_HTTP_URL: http://activity-service:8086
      STORIES_SERVICE_HTTP_URL: http://stories-service:8087
      CHAT_SERVICE_HTTP_URL: http://chat-service:8088
      REFERENCE_SERVICE_HTTP_URL: http://reference-service:8089
      ATTRACTION_SERVICE_HTTP_URL: http://attraction-service:8090
      PAYMENT_SERVICE_HTTP_URL: http://payment-service:8091

      REDIS_ADDR: redis:6379
      REDIS_CACHE_DB: 3
      REDIS_CACHE_TTL: 1h

      TOKEN_SERVICE_GRPC_TARGET: dns:///token-service:50051
      TOKEN_SERVICE_ID: api-gateway
      TOKEN_SERVICE_SECRET: api-gateway-secret
      TOKEN_SERVICE_CALL_TIMEOUT: 3s

      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      CORS_ALLOWED_HEADERS: Authorization,Content-Type,X-Request-Id
      CORS_EXPOSE_HEADERS: X-Request-Id
      CORS_ALLOW_CREDENTIALS: "false"
      CORS_MAX_AGE_SECONDS: 600

      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS_PER_MINUTE: 120
      RATE_LIMIT_CLEANUP_INTERVAL: 1m
    restart: unless-stopped
    networks:
      - flyfy-network

networks:
  flyfy-network:
    driver: bridge

volumes:
  token_postgres_data:
  auth_postgres_data:
  file_manager_postgres_data:
  file_manager_minio_data:
  user_postgres_data:
  guide_postgres_data:
  activity_postgres_data:
  stories_postgres_data:
  chat_postgres_data:
  nats_data:
  attraction_postgres_data:
  payment_postgres_data:
  token_service_keys:
