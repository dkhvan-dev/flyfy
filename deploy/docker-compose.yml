  # ============================================
  # Anti-Fraud PostgreSQL
  # ============================================
  anti-fraud-postgres:
    image: postgres:17-alpine
    container_name: anti-fraud-postgres
    environment:
      POSTGRES_DB: anti_fraud_service_db
      POSTGRES_USER: anti_fraud_service
      POSTGRES_PASSWORD: anti_fraud_secret_dev
    ports:
      - "5446:5432"
    volumes:
      - anti_fraud_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/014_anti_fraud_service.sh:/docker-entrypoint-initdb.d/014_anti_fraud_service.sh
      - ../backend/services/anti-fraud-service/migrations:/migrations/anti-fraud-service:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anti_fraud_service -d anti_fraud_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - inflap-network

  anti-fraud-postgres-migrator:
    image: postgres:17-alpine
    container_name: anti-fraud-postgres-migrator
    environment:
      PGHOST: anti-fraud-postgres
      PGPORT: 5432
      POSTGRES_DB: anti_fraud_service_db
      POSTGRES_USER: anti_fraud_service
      POSTGRES_PASSWORD: anti_fraud_secret_dev
    volumes:
      - ./init-scripts/014_anti_fraud_service_migrate.sh:/usr/local/bin/014_anti_fraud_service_migrate.sh:ro
      - ../backend/services/anti-fraud-service/migrations:/migrations/anti-fraud-service:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/014_anti_fraud_service_migrate.sh"]
    depends_on:
      anti-fraud-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - inflap-network

  # ============================================
  # Sticker Service PostgreSQL
  # ============================================
  sticker-postgres:
    image: postgres:17-alpine
    container_name: sticker-postgres
    environment:
      POSTGRES_DB: sticker_service_db
      POSTGRES_USER: sticker_service
      POSTGRES_PASSWORD: sticker_secret_dev
    ports:
      - "5443:5432"
    volumes:
      - sticker_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/011_sticker_service.sh:/docker-entrypoint-initdb.d/011_sticker_service.sh
      - ../backend/services/sticker-service/migrations:/migrations/sticker-service:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sticker_service -d sticker_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - inflap-network

  sticker-postgres-migrator:
    image: postgres:17-alpine
    container_name: sticker-postgres-migrator
    environment:
      PGHOST: sticker-postgres
      PGPORT: 5432
      POSTGRES_DB: sticker_service_db
      POSTGRES_USER: sticker_service
      POSTGRES_PASSWORD: sticker_secret_dev
    volumes:
      - ./init-scripts/011_sticker_service_migrate.sh:/usr/local/bin/011_sticker_service_migrate.sh:ro
      - ../backend/services/sticker-service/migrations:/migrations/sticker-service:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/011_sticker_service_migrate.sh"]
    depends_on:
      sticker-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - inflap-network

  # ============================================
  # Attraction Service
  # ============================================
  attraction-service:
    build:
      context: ..
      dockerfile: ./backend/services/attraction-service/Dockerfile
    container_name: attraction-service
    depends_on:
      attraction-postgres:
        condition: service_healthy
      attraction-postgres-migrator:
        condition: service_completed_successfully
      user-service:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      APP_NAME: attraction-service
      APP_ENV: development

      HTTP_PORT: 8090
      HTTP_READ_TIMEOUT: 15s
      HTTP_WRITE_TIMEOUT: 15s
      HTTP_IDLE_TIMEOUT: 60s

      POSTGRES_HOST: attraction-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: attraction_service
      POSTGRES_PASSWORD: attraction_secret_dev
      POSTGRES_DB: attraction_service_db
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_CONNS: 10
      POSTGRES_MIN_CONNS: 2

      LOG_LEVEL: info

      ATTRACTION_CACHE_ENABLED: "true"
      REDIS_ADDR: redis:6379
      REDIS_CACHE_DB: 4
      ATTRACTION_DETAIL_CACHE_TTL: 15m
      ATTRACTION_LIST_CACHE_TTL: 5m

      INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      REQUIRE_AUTHENTICATED_WRITES: "true"
      TRUSTED_GATEWAY_HEADER_USER_ID: X-User-Id
      TRUSTED_GATEWAY_HEADER_ROLES: X-User-Roles
      TRUSTED_GATEWAY_HEADER_SUB: X-Auth-Subject
      REQUEST_ID_HEADER: X-Request-Id

      USER_SERVICE_GRPC_TARGET: dns:///user-service:9094
    restart: unless-stopped
    networks:
      - inflap-network

  # ============================================
  # Payment Service
  # ============================================
  payment-service:
    build:
      context: ..
      dockerfile: ./backend/services/payment-service/Dockerfile
    container_name: payment-service
    depends_on:
      payment-postgres:
        condition: service_healthy
      payment-postgres-migrator:
        condition: service_completed_successfully
      anti-fraud-service:
        condition: service_started
    ports:
      - "8091:8091"
    environment:
      APP_NAME: payment-service
      APP_ENV: development

      HTTP_PORT: 8091
      HTTP_READ_TIMEOUT: 15s
      HTTP_WRITE_TIMEOUT: 15s
      HTTP_IDLE_TIMEOUT: 60s

      POSTGRES_HOST: payment-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: payment_service
      POSTGRES_PASSWORD: payment_secret_dev
      POSTGRES_DB: payment_service_db
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_OPEN_CONNS: 20
      POSTGRES_MIN_OPEN_CONNS: 2
      POSTGRES_MAX_CONN_LIFETIME: 1h
      POSTGRES_MAX_CONN_IDLE_TIME: 30m

      LOG_LEVEL: info
      PAYMENT_PROVIDER: mock

      INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      REQUIRE_AUTHENTICATED_REQUESTS: "true"
      REQUIRE_AUTHENTICATED_WRITES: "true"
      TRUSTED_GATEWAY_HEADER_USER_ID: X-User-Id
      TRUSTED_GATEWAY_HEADER_ROLES: X-User-Roles
      TRUSTED_GATEWAY_HEADER_SUB: X-Auth-Subject
      REQUEST_ID_HEADER: X-Request-Id

      ANTI_FRAUD_ENABLED: "true"
      ANTI_FRAUD_BASE_URL: http://anti-fraud-service:8096
      ANTI_FRAUD_INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      ANTI_FRAUD_TIMEOUT: 800ms
    restart: unless-stopped
    networks:
      - inflap-network

  # ============================================
  # Anti-Fraud Service
  # ============================================
  anti-fraud-service:
    build:
      context: ..
      dockerfile: ./backend/services/anti-fraud-service/Dockerfile
    container_name: anti-fraud-service
    depends_on:
      anti-fraud-postgres:
        condition: service_healthy
      anti-fraud-postgres-migrator:
        condition: service_completed_successfully
    ports:
      - "8096:8096"
    environment:
      APP_NAME: anti-fraud-service
      APP_ENV: development
      HTTP_PORT: 8096
      HTTP_READ_TIMEOUT: 15s
      HTTP_WRITE_TIMEOUT: 15s
      HTTP_IDLE_TIMEOUT: 60s

      POSTGRES_HOST: anti-fraud-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: anti_fraud_service
      POSTGRES_PASSWORD: anti_fraud_secret_dev
      POSTGRES_DB: anti_fraud_service_db
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_OPEN_CONNS: 20
      POSTGRES_MIN_OPEN_CONNS: 2
      POSTGRES_MAX_CONN_LIFETIME: 1h
      POSTGRES_MAX_CONN_IDLE_TIME: 30m

      LOG_LEVEL: info
      INTERNAL_SERVICE_TOKEN: super-secret-internal-token

      FRAUD_SHADOW_MODE: "true"
      FRAUD_WINDOW: 1h
      FRAUD_PAYMENT_CURRENCY: KZT
    restart: unless-stopped
    networks:
      - inflap-network

  # ============================================
  # Trust Service
  # ============================================
  trust-service:
    build:
      context: ..
      dockerfile: ./backend/services/trust-service/Dockerfile
    container_name: trust-service
    depends_on:
      trust-postgres:
        condition: service_healthy
      trust-postgres-migrator:
        condition: service_completed_successfully
    ports:
      - "9098:9096"
    environment:
      APP_ENV: development
      GRPC_PORT: 9096
      LOG_LEVEL: debug

      POSTGRES_HOST: trust-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: trust_service
      POSTGRES_PASSWORD: trust_secret_dev
      POSTGRES_DB: trust_service
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_OPEN_CONNS: 10
      POSTGRES_MIN_OPEN_CONNS: 2
      POSTGRES_MAX_CONN_LIFETIME: 1h
      POSTGRES_MAX_CONN_IDLE_TIME: 30m

      INTERNAL_SERVICE_TOKEN: super-secret-internal-token
    restart: unless-stopped
    networks:
      - inflap-network

  # ============================================
  # Sticker Service
  # ============================================
  sticker-service:
    build:
      context: ..
      dockerfile: ./backend/services/sticker-service/Dockerfile
    container_name: sticker-service
    depends_on:
      sticker-postgres:
        condition: service_healthy
      sticker-postgres-migrator:
        condition: service_completed_successfully
      file-manager-service:
        condition: service_started
    ports:
      - "8092:8092"
    environment:
      APP_NAME: sticker-service
      APP_ENV: development

      HTTP_PORT: 8092
      HTTP_READ_TIMEOUT: 15s
      HTTP_WRITE_TIMEOUT: 30s
      HTTP_IDLE_TIMEOUT: 120s

      DB_HOST: sticker-postgres
      DB_PORT: 5432
      DB_NAME: sticker_service_db
      DB_USER: sticker_service
      DB_PASSWORD: sticker_secret_dev
      DB_SSLMODE: disable
      DB_MAX_CONNS: 20
      DB_MIN_CONNS: 2
      DB_MAX_CONN_IDLE: 5m
      DB_MAX_CONN_LIFETIME: 1h

      LOG_LEVEL: debug

      INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      TRUSTED_GATEWAY_HEADER_USER_ID: X-User-Id
      TRUSTED_GATEWAY_HEADER_ROLES: X-User-Roles
      TRUSTED_GATEWAY_HEADER_SUB: X-Auth-Subject
      REQUEST_ID_HEADER: X-Request-Id

      FILE_MANAGER_BASE_URL: http://file-manager-service:8083
      FILE_MANAGER_TIMEOUT: 5s
      FILE_MANAGER_INTERNAL_SERVICE_TOKEN: super-secret-internal-token

      POST_MODERATION_ENABLED: "true"
      STICKER_UPLOAD_SESSION_TTL: 15m
    restart: unless-stopped
    networks:
      - inflap-network

  sticker-default-stickers-seeder:
    build:
      context: ..
      dockerfile: ./backend/services/sticker-service/Dockerfile
    container_name: sticker-default-stickers-seeder
    depends_on:
      sticker-postgres:
        condition: service_healthy
      sticker-postgres-migrator:
        condition: service_completed_successfully
      file-manager-service:
        condition: service_healthy
    environment:
      APP_NAME: sticker-default-stickers-seeder
      APP_ENV: development

      DB_HOST: sticker-postgres
      DB_PORT: 5432
      DB_NAME: sticker_service_db
      DB_USER: sticker_service
      DB_PASSWORD: sticker_secret_dev
      DB_SSLMODE: disable
      DB_MAX_CONNS: 5
      DB_MIN_CONNS: 1
      DB_MAX_CONN_IDLE: 5m
      DB_MAX_CONN_LIFETIME: 1h

      LOG_LEVEL: info

      INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      FILE_MANAGER_BASE_URL: http://file-manager-service:8083
      FILE_MANAGER_TIMEOUT: 10s
      FILE_MANAGER_INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      POST_MODERATION_ENABLED: "false"
      STICKER_UPLOAD_SESSION_TTL: 15m
    entrypoint: ["/app/seed-default-stickers"]
    restart: "no"
    networks:
      - inflap-network

  # ============================================
  # Reference Service
  # ============================================
  reference-service:
    build:
      context: ..
      dockerfile: ./backend/services/reference-service/Dockerfile
    container_name: reference-service
    ports:
      - "8089:8089"
    environment:
      APP_NAME: reference-service
      APP_ENV: development

      HTTP_PORT: 8089
      HTTP_READ_TIMEOUT: 10s
      HTTP_WRITE_TIMEOUT: 10s
      HTTP_IDLE_TIMEOUT: 60s

      LOG_LEVEL: info
    restart: unless-stopped
    networks:
      - inflap-network

  # ============================================
  # Currency Service
  # ============================================
  currency-service:
    build:
      context: ..
      dockerfile: ./backend/services/currency-service/Dockerfile
    container_name: currency-service
    ports:
      - "8098:8098"
    environment:
      APP_NAME: currency-service
      APP_ENV: development

      HTTP_PORT: 8098
      HTTP_READ_TIMEOUT: 10s
      HTTP_WRITE_TIMEOUT: 10s
      HTTP_IDLE_TIMEOUT: 60s

      CURRENCY_PROVIDER_BASE_URL: https://open.er-api.com/v6/latest
      CURRENCY_PROVIDER_TIMEOUT: 5s
      CURRENCY_RATE_CACHE_TTL: 1h

      LOG_LEVEL: info
    restart: unless-stopped
    networks:
      - inflap-network

  # ============================================
  # API Gateway
  # ============================================
  api-gateway:
    build:
      context: ..
      dockerfile: ./backend/services/api-gateway/Dockerfile
    container_name: api-gateway
    depends_on:
      token-service:
        condition: service_started
      auth-service:
        condition: service_started
      file-manager-service:
        condition: service_started
      user-service:
        condition: service_started
      guide-service:
        condition: service_started
      excursion-service:
        condition: service_started
      admin-panel:
        condition: service_started
      feed-service:
        condition: service_started
      chat-service:
        condition: service_started
      notification-service:
        condition: service_started
      sticker-service:
        condition: service_started
      reference-service:
        condition: service_started
      currency-service:
        condition: service_started
      attraction-service:
        condition: service_started
      payment-service:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development

      HTTP_PORT: 8080
      HTTP_READ_TIMEOUT: 15s
      HTTP_WRITE_TIMEOUT: 15s
      HTTP_IDLE_TIMEOUT: 60s

      LOG_LEVEL: info

      REQUEST_ID_HEADER: X-Request-Id
      TRUSTED_HEADER_USER_ID: X-User-Id
      TRUSTED_HEADER_ROLES: X-User-Roles
      TRUSTED_HEADER_SUB: X-Auth-Subject
      INTERNAL_SERVICE_TOKEN: super-secret-internal-token

      API_PREFIX: /api/v1

      AUTH_SERVICE_HTTP_URL: http://auth-service:8082
      USER_SERVICE_HTTP_URL: http://user-service:8084
      GUIDE_SERVICE_HTTP_URL: http://guide-service:8085
      EXCURSION_SERVICE_HTTP_URL: http://excursion-service:8093
      FILE_MANAGER_HTTP_URL: http://file-manager-service:8083
      ACTIVITY_SERVICE_HTTP_URL: http://activity-service:8086
      FEED_SERVICE_HTTP_URL: http://feed-service:8087
      CHAT_SERVICE_HTTP_URL: http://chat-service:8088
      NOTIFICATION_SERVICE_HTTP_URL: http://notification-service:8097
      STICKER_SERVICE_HTTP_URL: http://sticker-service:8092
      REFERENCE_SERVICE_HTTP_URL: http://reference-service:8089
      CURRENCY_SERVICE_HTTP_URL: http://currency-service:8098
      ATTRACTION_SERVICE_HTTP_URL: http://attraction-service:8090
      PAYMENT_SERVICE_HTTP_URL: http://payment-service:8091
      ADMIN_PANEL_SERVICE_HTTP_URL: http://admin-panel:8095

      REDIS_ADDR: redis:6379
      REDIS_CACHE_DB: 3
      REDIS_CACHE_TTL: 1h

      TOKEN_SERVICE_GRPC_TARGET: dns:///token-service:50051
      TOKEN_SERVICE_ID: api-gateway
      TOKEN_SERVICE_SECRET: api-gateway-secret
      TOKEN_SERVICE_CALL_TIMEOUT: 3s

      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      CORS_ALLOWED_HEADERS: Authorization,Content-Type,X-Request-Id
      CORS_EXPOSE_HEADERS: X-Request-Id
      CORS_ALLOW_CREDENTIALS: "false"
      CORS_MAX_AGE_SECONDS: 600

      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS_PER_MINUTE: 120
      RATE_LIMIT_CLEANUP_INTERVAL: 1m
    restart: unless-stopped
    networks:
      - inflap-network

networks:
  inflap-network:
    driver: bridge

volumes:
  token_postgres_data:
  auth_postgres_data:
  file_manager_postgres_data:
  file_manager_minio_data:
  user_postgres_data:
  guide_postgres_data:
  activity_postgres_data:
  excursion_postgres_data:
  admin_postgres_data:
  trust_postgres_data:
  feed_postgres_data:
  chat_postgres_data:
  notification_postgres_data:
  nats_data:
  attraction_postgres_data:
  payment_postgres_data:
  anti_fraud_postgres_data:
  sticker_postgres_data:
  token_service_keys:
  translation_hf_cache:
