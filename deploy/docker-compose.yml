      POSTGRES_PASSWORD: attraction_secret_dev
    ports:
      - "5441:5432"
    volumes:
      - attraction_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/009_attraction_service.sh:/docker-entrypoint-initdb.d/009_attraction_service.sh
      - ../backend/services/attraction-service/migrations:/migrations/attraction-service:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attraction_service -d attraction_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - inflap-network

  attraction-postgres-migrator:
    image: postgres:17-alpine
    container_name: attraction-postgres-migrator
    environment:
      PGHOST: attraction-postgres
      PGPORT: 5432
      POSTGRES_DB: attraction_service_db
      POSTGRES_USER: attraction_service
      POSTGRES_PASSWORD: attraction_secret_dev
    volumes:
      - ./init-scripts/009_attraction_service_migrate.sh:/usr/local/bin/009_attraction_service_migrate.sh:ro
      - ../backend/services/attraction-service/migrations:/migrations/attraction-service:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/009_attraction_service_migrate.sh"]
    depends_on:
      attraction-postgres:
        condition: service_healthy
    restart: "no"
    networks:
