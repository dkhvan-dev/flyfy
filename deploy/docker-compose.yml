  # ============================================
  payment-postgres:
    image: postgres:17-alpine
    container_name: payment-postgres
    environment:
      POSTGRES_DB: payment_service_db
      POSTGRES_USER: payment_service
      POSTGRES_PASSWORD: payment_secret_dev
    ports:
      - "5442:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/010_payment_service.sh:/docker-entrypoint-initdb.d/010_payment_service.sh
      - ../backend/services/payment-service/migrations:/migrations/payment-service:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_service -d payment_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - inflap-network

  payment-postgres-migrator:
    image: postgres:17-alpine
    container_name: payment-postgres-migrator
    environment:
      PGHOST: payment-postgres
      PGPORT: 5432
      POSTGRES_DB: payment_service_db
