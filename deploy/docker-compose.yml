services:
  # ============================================
  # Token Service
  # ============================================
  token-service:
    build:
      context: ..
      dockerfile: ./backend/services/token-service/Dockerfile
    ports:
      - "50051:50051"   # gRPC
      - "8081:8081"     # HTTP (JWKS + Health)
    environment:
      APP_ENV: development
      GRPC_PORT: 50051
      HTTP_PORT: 8081
      JWT_ISSUER: tourism-superapp/token-service
      JWT_ACCESS_TTL: 30m
      JWT_REFRESH_TTL: 720h
      JWT_SERVICE_TTL: 1h
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: token_service
      PG_PASSWORD: token_secret_dev
      PG_DBNAME: token_service
      PG_SSLMODE: disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # Auth Service
  # ============================================
  auth-service:
    build:
      context: ..
      dockerfile: ./backend/services/auth-service/Dockerfile
    ports:
      - "50052:50052"   # gRPC (reserved)
      - "8082:8082"     # HTTP (REST API)
    environment:
      APP_ENV: development
      GRPC_PORT: 50052
      HTTP_PORT: 8082
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: auth_service
      PG_PASSWORD: auth_secret_dev
      PG_DBNAME: auth_db
      PG_SSLMODE: disable
      REDIS_ADDR: redis:6379
      REDIS_DB: 1
      TOKEN_SERVICE_ADDR: token-service:50051
      TOKEN_SERVICE_ID: auth-service
      TOKEN_SERVICE_SECRET: auth-service-secret
      OTP_LENGTH: 6
      OTP_TTL: 5m
      OTP_MAX_ATTEMPTS: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      token-service:
        condition: service_started
    restart: unless-stopped

  # ============================================
  # PostgreSQL
  # ============================================
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: token_service
      POSTGRES_PASSWORD: token_secret_dev
      POSTGRES_DB: token_service
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts (executed in alphabetical order)
      - ./init-scripts/000_create_databases.sql:/docker-entrypoint-initdb.d/000_create_databases.sql
      - ./init-scripts/001_token_service.sh:/docker-entrypoint-initdb.d/001_token_service.sh
      - ./init-scripts/002_auth_service.sh:/docker-entrypoint-initdb.d/002_auth_service.sh
      # Migration files (mounted read-only, used by init scripts)
      - ../backend/services/token-service/migrations:/migrations/token-service:ro
      - ../backend/services/auth-service/migrations:/migrations/auth-service:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U token_service"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================
  # File Manager PostgreSQL
  # ============================================
  file-manager-postgres:
    image: postgres:17-alpine
    container_name: flyfy-file-manager-postgres
    environment:
      POSTGRES_DB: file_manager_db
      POSTGRES_USER: flyfy
      POSTGRES_PASSWORD: flyfy
    ports:
      - "5435:5432"
    volumes:
      - file_manager_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/003_file_manager.sh:/docker-entrypoint-initdb.d/003_file_manager.sh
      - ../backend/services/file-manager-service/migrations:/migrations/file-manager-service:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyfy -d file_manager_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # File Manager MinIO
  # ============================================
  file-manager-minio:
    image: minio/minio:latest
    container_name: flyfy-file-manager-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: flyfy
      MINIO_ROOT_PASSWORD: flyfysecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - file_manager_minio_data:/data
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5

  # ============================================
  # File Manager MinIO Init
  # ============================================
  file-manager-minio-init:
    image: minio/mc:latest
    container_name: flyfy-file-manager-minio-init
    depends_on:
      file-manager-minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://file-manager-minio:9000 flyfy flyfysecret;
      mc mb -p local/flyfy-files || true;
      mc anonymous set private local/flyfy-files || true;
      exit 0;
      "

  # ============================================
  # File Manager Service
  # ============================================
  file-manager-service:
    build:
      context: ..
      dockerfile: ./backend/services/file-manager-service/Dockerfile
    container_name: flyfy-file-manager-service
    depends_on:
      file-manager-postgres:
        condition: service_healthy
      file-manager-minio-init:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
      - "9093:9093"
    environment:
      APP_ENV: development

      HTTP_PORT: 8083
      GRPC_PORT: 9093

      POSTGRES_HOST: file-manager-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: flyfy
      POSTGRES_PASSWORD: flyfy
      POSTGRES_DB: file_manager_db
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_OPEN_CONNS: 10
      POSTGRES_MIN_OPEN_CONNS: 2
      POSTGRES_MAX_CONN_LIFETIME: 1h
      POSTGRES_MAX_CONN_IDLE_TIME: 30m

      STORAGE_PROVIDER: s3
      STORAGE_ENDPOINT: http://file-manager-minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: flyfy
      STORAGE_SECRET_ACCESS_KEY: flyfysecret
      STORAGE_BUCKET: flyfy-files
      STORAGE_USE_PATH_STYLE: "true"
      STORAGE_PRESIGN_TTL: 15m
      STORAGE_MAX_UPLOAD_SIZE_BYTES: 26214400

      LOG_LEVEL: debug

      INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      REQUIRE_AUTHENTICATED_WRITES: "true"
      TRUSTED_GATEWAY_HEADER_USER_ID: X-User-Id
      TRUSTED_GATEWAY_HEADER_ROLES: X-User-Roles
      REQUEST_ID_HEADER: X-Request-Id
    restart: unless-stopped

volumes:
  pgdata:
  file_manager_postgres_data:
  file_manager_minio_data: