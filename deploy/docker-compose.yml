services:
  # ============================================
  # Token Service PostgreSQL
  # ============================================
  token-postgres:
    image: postgres:17-alpine
    container_name: token-postgres
    environment:
      POSTGRES_DB: token_service
      POSTGRES_USER: token_service
      POSTGRES_PASSWORD: token_secret_dev
    ports:
      - "5432:5432"
    volumes:
      - token_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/001_token_service.sh:/docker-entrypoint-initdb.d/001_token_service.sh
      - ../backend/services/token-service/migrations:/migrations/token-service:ro
      - ./init-scripts/001_token_service_seed_services.sh:/docker-entrypoint-initdb.d/001_token_service_seed_services.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U token_service -d token_service"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - inflap-network

  token-postgres-migrator:
    image: postgres:17-alpine
    container_name: token-postgres-migrator
    environment:
      PGHOST: token-postgres
      PGPORT: 5432
      POSTGRES_DB: token_service
      POSTGRES_USER: token_service
      POSTGRES_PASSWORD: token_secret_dev
    volumes:
      - ./init-scripts/001_token_service_migrate.sh:/usr/local/bin/001_token_service_migrate.sh:ro
      - ../backend/services/token-service/migrations:/migrations/token-service:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/001_token_service_migrate.sh"]
    depends_on:
      token-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - inflap-network

