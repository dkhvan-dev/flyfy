      - inflap-network

  # ============================================
  # NATS
  # ============================================
  nats:
    image: nats:2
    container_name: inflap-nats
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
    healthcheck:
      # The official nats:2 image is minimal and does not ship wget/curl.
      # Use the bundled nats-server binary to probe the main process instead.
      # The config file keeps reload signals safe and avoids false failures.
      test: ["CMD", "/nats-server", "--signal", "reload=1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - inflap-network

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: inflap-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - inflap-network

  # ============================================
  # File Manager MinIO
  # ============================================
  file-manager-minio:
    image: minio/minio:latest
    container_name: file-manager-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: inflap
      MINIO_ROOT_PASSWORD: inflapsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - file_manager_minio_data:/data
    restart: unless-stopped
    networks:
      - inflap-network

  # ============================================
  # File Manager MinIO Init
  # ============================================
  file-manager-minio-init:
    image: minio/mc:latest
    container_name: file-manager-minio-init
    depends_on:
      file-manager-minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://file-manager-minio:9000 inflap inflapsecret;
      mc mb -p local/inflap-files || true;
      mc anonymous set private local/inflap-files || true;
      exit 0;
      "
    networks:
      - inflap-network

  # ============================================
  # Token Service
  # ============================================
  token-service:
    build:
      context: ..
      dockerfile: ./backend/services/token-service/Dockerfile
    container_name: token-service
    ports:
      - "50051:50051"
      - "8081:8081"
    environment:
      APP_ENV: development
      GRPC_PORT: 50051
      HTTP_PORT: 8081

      JWT_ISSUER: tourism-inflap/token-service
      JWT_ACCESS_TTL: 30m
      JWT_REFRESH_TTL: 720h
      JWT_SERVICE_TTL: 1h
      JWT_PRIVATE_KEY_PATH: /var/lib/inflap/token-service/signing-keys.json

      PG_HOST: token-postgres
      PG_PORT: 5432
      PG_USER: token_service
      PG_PASSWORD: token_secret_dev
      PG_DBNAME: token_service
      PG_SSLMODE: disable

      REDIS_ADDR: redis:6379

      NOTIFICATION_SERVICE_HTTP_URL: http://notification-service:8097
      NOTIFICATION_INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      NOTIFICATION_SERVICE_TIMEOUT: 2s
    volumes:
      - token_service_keys:/var/lib/inflap/token-service
    depends_on:
      token-postgres:
        condition: service_healthy
      token-postgres-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - inflap-network

  # ============================================
  # Auth Service
  # ============================================
  auth-service:
    build:
      context: ..
      dockerfile: ./backend/services/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "50052:50052"
      - "8082:8082"
    environment:
      APP_ENV: development
      GRPC_PORT: 50052
      HTTP_PORT: 8082

      PG_HOST: auth-postgres
      PG_PORT: 5432
      PG_USER: auth_service
      PG_PASSWORD: auth_secret_dev
      PG_DBNAME: auth_db
      PG_SSLMODE: disable

      REDIS_ADDR: redis:6379
      REDIS_DB: 1

      TOKEN_SERVICE_ADDR: token-service:50051
      TOKEN_SERVICE_ID: auth-service
      TOKEN_SERVICE_SECRET: auth-service-secret

      OTP_LENGTH: 6
      OTP_TTL: 5m
      OTP_MAX_ATTEMPTS: 5
      EMAIL_OTP_FROM_ADDRESS: "Inflap <dkhvan.developer@gmail.com>"
      EMAIL_SMTP_HOST: smtp.gmail.com
      EMAIL_SMTP_PORT: 587
      EMAIL_SMTP_USERNAME: dkhvan.developer@gmail.com
      EMAIL_SMTP_PASSWORD: ${AUTH_EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_TIMEOUT: 8s

      ANTI_FRAUD_ENABLED: "true"
      ANTI_FRAUD_BASE_URL: http://anti-fraud-service:8096
      ANTI_FRAUD_INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      ANTI_FRAUD_SIGNAL_HASH_KEY: dev-anti-fraud-signal-hash-key-change-me
      ANTI_FRAUD_TIMEOUT: 800ms

      USER_SERVICE_GRPC_TARGET: dns:///user-service:9094
      USER_SERVICE_INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      USER_SERVICE_CALLER_NAME: auth-service
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-postgres-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      token-service:
        condition: service_started
      user-service:
        condition: service_started
      anti-fraud-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - inflap-network

  # ============================================
  # File Manager Service
  # ============================================
  file-manager-service:
    build:
      context: ..
      dockerfile: ./backend/services/file-manager-service/Dockerfile
    container_name: file-manager-service
    depends_on:
      file-manager-postgres:
        condition: service_healthy
      file-manager-minio-init:
        condition: service_completed_successfully
      anti-fraud-service:
        condition: service_started
      trust-service:
        condition: service_started
    ports:
      - "8083:8083"
      - "9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      APP_ENV: development
      HTTP_PORT: 8083
      GRPC_PORT: 9093

      POSTGRES_HOST: file-manager-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: file_manager
      POSTGRES_PASSWORD: file_manager_secret_dev
      POSTGRES_DB: file_manager_db
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_OPEN_CONNS: 10
      POSTGRES_MIN_OPEN_CONNS: 2
      POSTGRES_MAX_CONN_LIFETIME: 1h
      POSTGRES_MAX_CONN_IDLE_TIME: 30m

      STORAGE_PROVIDER: s3
      STORAGE_ENDPOINT: http://file-manager-minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: inflap
      STORAGE_SECRET_ACCESS_KEY: inflapsecret
      STORAGE_BUCKET: inflap-files
      STORAGE_USE_PATH_STYLE: "true"
      STORAGE_PRESIGN_TTL: 15m
      STORAGE_MAX_UPLOAD_SIZE_BYTES: 26214400

      LOG_LEVEL: debug

      INTERNAL_SERVICE_TOKEN: super-secret-internal-token
      REQUIRE_AUTHENTICATED_WRITES: "true"
      TRUSTED_GATEWAY_HEADER_USER_ID: X-User-Id
      TRUSTED_GATEWAY_HEADER_ROLES: X-User-Roles
      TRUSTED_GATEWAY_HEADER_SUB: X-Auth-Subject
      REQUEST_ID_HEADER: X-Request-Id

