          TOKEN_SERVICE_MTLS_ALLOWED_SPIFFE_IDS: ${{ vars.TOKEN_SERVICE_MTLS_ALLOWED_SPIFFE_IDS || 'spiffe://inflap/test/activity-service,spiffe://inflap/test/api-gateway,spiffe://inflap/test/auth-service,spiffe://inflap/test/excursion-service,spiffe://inflap/test/feed-service,spiffe://inflap/test/guide-service,spiffe://inflap/test/place-service,spiffe://inflap/test/search-service,spiffe://inflap/test/support-service,spiffe://inflap/test/translation-service,spiffe://inflap/test/user-service' }}
          TOKEN_SERVICE_MTLS_ALLOWED_DNS_NAMES: ${{ vars.TOKEN_SERVICE_MTLS_ALLOWED_DNS_NAMES || 'activity-service,api-gateway,auth-service,excursion-service,feed-service,guide-service,place-service,search-service,support-service,translation-service,user-service' }}
          TRUST_SERVICE_INTERNAL_GRPC_TLS_PORT: ${{ vars.TRUST_SERVICE_INTERNAL_GRPC_TLS_PORT || '9442' }}
          TRUST_SERVICE_INTERNAL_GRPC_TARGET: ${{ vars.TRUST_SERVICE_INTERNAL_GRPC_TARGET || 'dns:///trust-service:9442' }}
          TRUST_SERVICE_MTLS_ALLOWED_SPIFFE_IDS: ${{ vars.TRUST_SERVICE_MTLS_ALLOWED_SPIFFE_IDS || 'spiffe://inflap/test/admin-panel,spiffe://inflap/test/activity-service,spiffe://inflap/test/api-gateway,spiffe://inflap/test/chat-service,spiffe://inflap/test/excursion-service,spiffe://inflap/test/file-manager-service' }}
          TRUST_SERVICE_MTLS_ALLOWED_DNS_NAMES: ${{ vars.TRUST_SERVICE_MTLS_ALLOWED_DNS_NAMES || 'admin-panel,activity-service,api-gateway,chat-service,excursion-service,file-manager-service' }}
          FILE_MANAGER_SERVICE_INTERNAL_HTTP_TLS_PORT: ${{ vars.FILE_MANAGER_SERVICE_INTERNAL_HTTP_TLS_PORT || '9483' }}
          FILE_MANAGER_SERVICE_INTERNAL_HTTP_URL: ${{ vars.FILE_MANAGER_SERVICE_INTERNAL_HTTP_URL || 'https://file-manager-service:9483' }}
          FILE_MANAGER_SERVICE_INTERNAL_GRPC_TLS_PORT: ${{ vars.FILE_MANAGER_SERVICE_INTERNAL_GRPC_TLS_PORT || '9443' }}
          FILE_MANAGER_SERVICE_INTERNAL_GRPC_TARGET: ${{ vars.FILE_MANAGER_SERVICE_INTERNAL_GRPC_TARGET || 'dns:///file-manager-service:9443' }}
          FILE_MANAGER_SERVICE_MTLS_ALLOWED_SPIFFE_IDS: ${{ vars.FILE_MANAGER_SERVICE_MTLS_ALLOWED_SPIFFE_IDS || 'spiffe://inflap/test/activity-service,spiffe://inflap/test/api-gateway,spiffe://inflap/test/excursion-service,spiffe://inflap/test/feed-service,spiffe://inflap/test/guide-service,spiffe://inflap/test/sticker-service,spiffe://inflap/test/user-service' }}
          FILE_MANAGER_SERVICE_MTLS_ALLOWED_DNS_NAMES: ${{ vars.FILE_MANAGER_SERVICE_MTLS_ALLOWED_DNS_NAMES || 'activity-service,api-gateway,excursion-service,feed-service,guide-service,sticker-service,user-service' }}
          USER_SERVICE_INTERNAL_HTTP_TLS_PORT: ${{ vars.USER_SERVICE_INTERNAL_HTTP_TLS_PORT || '9484' }}
          USER_SERVICE_INTERNAL_HTTP_URL: ${{ vars.USER_SERVICE_INTERNAL_HTTP_URL || 'https://user-service:9484' }}
          USER_SERVICE_INTERNAL_GRPC_TLS_PORT: ${{ vars.USER_SERVICE_INTERNAL_GRPC_TLS_PORT || '9444' }}
          USER_SERVICE_INTERNAL_GRPC_TARGET: ${{ vars.USER_SERVICE_INTERNAL_GRPC_TARGET || 'dns:///user-service:9444' }}
          USER_SERVICE_MTLS_ALLOWED_SPIFFE_IDS: ${{ vars.USER_SERVICE_MTLS_ALLOWED_SPIFFE_IDS || 'spiffe://inflap/test/admin-panel,spiffe://inflap/test/activity-service,spiffe://inflap/test/api-gateway,spiffe://inflap/test/auth-service,spiffe://inflap/test/chat-service,spiffe://inflap/test/excursion-service,spiffe://inflap/test/feed-service,spiffe://inflap/test/guide-service,spiffe://inflap/test/place-service,spiffe://inflap/test/support-service' }}
          USER_SERVICE_MTLS_ALLOWED_DNS_NAMES: ${{ vars.USER_SERVICE_MTLS_ALLOWED_DNS_NAMES || 'admin-panel,activity-service,api-gateway,auth-service,chat-service,excursion-service,feed-service,guide-service,place-service,support-service' }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "${TEST_DEPLOY_SSH_KEY}" > ~/.ssh/inflap_test_deploy_key
          chmod 600 ~/.ssh/inflap_test_deploy_key
          printf '%s\n' "${TEST_DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts

          control_path="${HOME}/.ssh/inflap_test_deploy_mux"
          ssh_opts=(
            -i ~/.ssh/inflap_test_deploy_key
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ConnectionAttempts=3
            -o "Port=${TEST_DEPLOY_PORT}"
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
            -o ControlMaster=auto
            -o "ControlPath=${control_path}"
            -o ControlPersist=5m
          )

          echo "Opening SSH control connection for deploy host on port ${TEST_DEPLOY_PORT}..."
          ssh "${ssh_opts[@]}" -Nf "${TEST_DEPLOY_USER}@${TEST_DEPLOY_HOST}"
          cleanup_ssh_control() {
            ssh "${ssh_opts[@]}" -O exit "${TEST_DEPLOY_USER}@${TEST_DEPLOY_HOST}" >/dev/null 2>&1 || true
          }
          trap cleanup_ssh_control EXIT

          scp "${ssh_opts[@]}" /tmp/inflap-test-infra.tgz \
            "${TEST_DEPLOY_USER}@${TEST_DEPLOY_HOST}:/tmp/inflap-test-infra.tgz"

          ssh "${ssh_opts[@]}" "${TEST_DEPLOY_USER}@${TEST_DEPLOY_HOST}" \
            "set -e; tar -tzf /tmp/inflap-test-infra.tgz >/dev/null; mkdir -p /opt/inflap; if [ -f /opt/inflap/docker-compose.test.yml ]; then cp -p /opt/inflap/docker-compose.test.yml /opt/inflap/docker-compose.test.yml.previous; else rm -f /opt/inflap/docker-compose.test.yml.previous; fi; tar -xzf /tmp/inflap-test-infra.tgz -C /opt/inflap; chmod +x /opt/inflap/scripts/*.sh"

          if [[ -n "${GHCR_USERNAME}" && -n "${GHCR_READ_TOKEN}" ]]; then
            printf 'GHCR_USERNAME=%s\nGHCR_READ_TOKEN=%s\n' "${GHCR_USERNAME}" "${GHCR_READ_TOKEN}" | \
              ssh "${ssh_opts[@]}" "${TEST_DEPLOY_USER}@${TEST_DEPLOY_HOST}" \
              "mkdir -p /opt/inflap/env && umask 077 && cat > /opt/inflap/env/ghcr.env"
          fi

          runtime_env_file="$(mktemp)"
          for name in \
            EMAIL_OTP_FROM_ADDRESS \
            RESEND_API_KEY \
            RESEND_BASE_URL \
            RESEND_TIMEOUT \
            API_GATEWAY_TOKEN_SERVICE_SECRET \
            AUTH_SERVICE_TOKEN_SERVICE_SECRET \
            ACTIVITY_SERVICE_TOKEN_SERVICE_SECRET \
            EXCURSION_SERVICE_TOKEN_SERVICE_SECRET \
            FEED_SERVICE_TOKEN_SERVICE_SECRET \
            GUIDE_SERVICE_TOKEN_SERVICE_SECRET \
            PLACE_SERVICE_TOKEN_SERVICE_SECRET \
            SUPPORT_SERVICE_TOKEN_SERVICE_SECRET \
            USER_SERVICE_TOKEN_SERVICE_SECRET \
            TRANSLATION_PROVIDER \
            TRANSLATION_BILLING_MODE \
            TRANSLATION_MONTHLY_CHARACTER_LIMIT \
            TRANSLATION_QUOTA_WARNING_THRESHOLD \
            TRANSLATION_QUOTA_CRITICAL_THRESHOLD \
            AZURE_TRANSLATOR_ENDPOINT \
            AZURE_TRANSLATOR_KEY \
            AZURE_TRANSLATOR_REGION \
            AZURE_TRANSLATOR_TIMEOUT \
            ACTIVITY_ASYNC_TRANSLATION_ENABLED \
            ACTIVITY_TRANSLATION_WORKER_ENABLED \
            ACTIVITY_TRANSLATION_WORKER_BATCH_SIZE \
            ACTIVITY_TRANSLATION_WORKER_INTERVAL \
            ACTIVITY_TRANSLATION_MAX_ATTEMPTS \
            ACTIVITY_TRANSLATION_RETRY_BASE_DELAY \
            ACTIVITY_TRANSLATION_REQUEST_TIMEOUT \
            ACTIVITY_TRANSLATION_LOCK_TIMEOUT \
            EXCURSION_ASYNC_TRANSLATION_ENABLED \
            EXCURSION_TRANSLATION_WORKER_ENABLED \
            EXCURSION_TRANSLATION_WORKER_BATCH_SIZE \
            EXCURSION_TRANSLATION_WORKER_INTERVAL \
            EXCURSION_TRANSLATION_MAX_ATTEMPTS \
            EXCURSION_TRANSLATION_RETRY_BASE_DELAY \
            EXCURSION_TRANSLATION_REQUEST_TIMEOUT \
            EXCURSION_TRANSLATION_LOCK_TIMEOUT \
            MTLS_MODE \
            MTLS_MIN_VERSION \
            MTLS_CERT_GROUP_ID \
            ADMIN_PANEL_MTLS_MODE \
            ANTI_FRAUD_SERVICE_MTLS_MODE \
            API_GATEWAY_MTLS_MODE \
            ACTIVITY_SERVICE_MTLS_MODE \
            AUTH_SERVICE_MTLS_MODE \
            CHAT_SERVICE_MTLS_MODE \
            CHECKLIST_SERVICE_MTLS_MODE \
            CURRENCY_SERVICE_MTLS_MODE \
            EXCURSION_SERVICE_MTLS_MODE \
            FEED_SERVICE_MTLS_MODE \
            FILE_MANAGER_SERVICE_MTLS_MODE \
            GUIDE_SERVICE_MTLS_MODE \
            NOTIFICATION_SERVICE_MTLS_MODE \
