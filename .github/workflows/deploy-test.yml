name: Deploy Test Environment

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated service names, "all", or "auto".'
        required: true
        default: auto
      deploy:
        description: 'Deploy to the test VPS after building images.'
        type: boolean
        required: true
        default: true
      run_tests:
        description: 'Run Go service tests before building images.'
        type: boolean
        required: true
        default: true
  push:
    branches:
      - develop
    paths:
      - 'backend/services/**'
      - 'backend/pkg/**'
      - 'proto/**'
      - 'deploy/init-scripts/**'
      - 'infra/test/**'
      - '.github/workflows/deploy-test.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_PLATFORM: linux/amd64

jobs:
  build:
    name: Build linux/amd64 test service images
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.detect.outputs.services }}
      image_namespace: ${{ steps.meta.outputs.image_namespace }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          image_namespace="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo_name="$(basename '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image_prefix="${repo_name}-"
          image_tag="test-${GITHUB_SHA::12}"
          echo "image_namespace=${image_namespace}" >>"${GITHUB_OUTPUT}"
          echo "image_prefix=${image_prefix}" >>"${GITHUB_OUTPUT}"
          echo "image_tag=${image_tag}" >>"${GITHUB_OUTPUT}"

      - name: Detect services to build
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          all_services=(
            activity-service
            admin-panel
            anti-fraud-service
            api-gateway
            auth-service
            chat-service
            checklist-service
            currency-service
            excursion-service
            feed-service
            file-manager-service
            guide-service
            notification-service
            payment-service
            place-service
            reference-service
            routing-service
            search-service
            sticker-service
            support-service
            switches-service
            token-service
            translation-service
            trust-service
            user-route-service
            user-service
          )

          requested="${{ github.event.inputs.services || 'auto' }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${requested}" != "auto" ]]; then
            if [[ "${requested}" == "all" ]]; then
              selected=("${all_services[@]}")
            else
              IFS=',' read -ra selected <<<"${requested}"
              for i in "${!selected[@]}"; do
                selected[$i]="$(echo "${selected[$i]}" | xargs)"
              done
            fi
          else
            base_sha="${{ github.event.before }}"
            if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
              base_sha="$(git rev-parse HEAD^)"
            fi
            changed_files="$(git diff --name-only "${base_sha}" "${GITHUB_SHA}" || true)"

            selected=()
            if grep -Eq '^(proto/|backend/pkg/)' <<<"${changed_files}"; then
              selected=("${all_services[@]}")
            else
              for service in "${all_services[@]}"; do
                if grep -q "^backend/services/${service}/" <<<"${changed_files}"; then
                  selected+=("${service}")
                fi
              done
            fi
          fi

          if [[ ${#selected[@]} -eq 0 ]]; then
            echo "No service images need rebuild."
            echo 'services=[]' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          printf 'Selected services:\n'
          printf ' - %s\n' "${selected[@]}"

          json="$(printf '%s\n' "${selected[@]}" | jq -R . | jq -cs .)"
          echo "services=${json}" >>"${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: ${{ steps.detect.outputs.services != '[]' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ steps.detect.outputs.services != '[]' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Go
        if: ${{ steps.detect.outputs.services != '[]' && (github.event_name == 'push' || inputs.run_tests || inputs.deploy) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: proto/go.mod
          cache-dependency-path: |
            proto/go.sum
            backend/pkg/**/go.sum
            backend/services/*/go.sum

      - name: Run selected Go service tests
        if: ${{ steps.detect.outputs.services != '[]' && (github.event_name == 'push' || inputs.run_tests || inputs.deploy) }}
        shell: bash
        env:
          SERVICES_JSON: ${{ steps.detect.outputs.services }}
        run: |
          set -euo pipefail

          mapfile -t services < <(jq -r '.[]' <<<"${SERVICES_JSON}")
          for service in "${services[@]}"; do
            if [[ ! -f "backend/services/${service}/go.mod" ]]; then
              echo "Skipping ${service}: no Go module found."
              continue
            fi

            echo "::group::Test ${service}"
            (
              cd "backend/services/${service}"
              GOWORK=off go test ./...
            )
            echo "::endgroup::"
          done

      - name: Build and push selected images
        if: ${{ steps.detect.outputs.services != '[]' }}
        shell: bash
        env:
          SERVICES_JSON: ${{ steps.detect.outputs.services }}
          IMAGE_NAMESPACE: ${{ steps.meta.outputs.image_namespace }}
          IMAGE_PREFIX: ${{ steps.meta.outputs.image_prefix }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail

          mapfile -t services < <(jq -r '.[]' <<<"${SERVICES_JSON}")
          for service in "${services[@]}"; do
            echo "::group::Build ${service}"
            cache_ref="${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_PREFIX}${service}:buildcache"
            docker buildx build \
              --platform "${IMAGE_PLATFORM}" \
              --file "backend/services/${service}/Dockerfile" \
              --cache-from "type=registry,ref=${cache_ref}" \
              --cache-to "type=registry,ref=${cache_ref},mode=max" \
              --tag "${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_PREFIX}${service}:${IMAGE_TAG}" \
              --tag "${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_PREFIX}${service}:test-latest" \
              --push \
              .
            echo "::endgroup::"
          done

  deploy:
    name: Deploy to netcup test VPS
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: build
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy == 'true' }}
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment tooling
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            infra/test/scripts/deploy.sh \
            infra/test/scripts/backup-postgres.sh \
            infra/test/scripts/migrate-postgres.sh \
            infra/test/scripts/preflight-mtls-certs.sh \
            infra/test/scripts/smoke-check.sh
          bash infra/test/scripts/backup-postgres.test.sh
          bash infra/test/scripts/deployment-config.test.sh
          bash infra/test/scripts/deploy.test.sh
          bash infra/test/scripts/migrate-postgres.test.sh
          bash infra/test/scripts/smoke-check.test.sh
          compose_validation_env=(
            ACTIVITY_SERVICE_TOKEN_SERVICE_SECRET=compose-validation
            API_GATEWAY_TOKEN_SERVICE_SECRET=compose-validation
            ATTENDANCE_QR_SIGNING_SECRET=compose-validation
            AUTH_SERVICE_TOKEN_SERVICE_SECRET=compose-validation
            EXCURSION_ATTENDANCE_QR_SIGNING_SECRET=compose-validation
            EXCURSION_SERVICE_TOKEN_SERVICE_SECRET=compose-validation
            FEED_SERVICE_TOKEN_SERVICE_SECRET=compose-validation
            GUIDE_SERVICE_TOKEN_SERVICE_SECRET=compose-validation
            INTERNAL_SERVICE_TOKEN=compose-validation
            MINIO_ROOT_PASSWORD=compose-validation
            MTLS_MODE=disabled
            MTLS_SECRETS_DIR=/opt/inflap/secrets/mtls
            NOTIFICATION_TOKEN_ENCRYPTION_KEY_BASE64=compose-validation
            NOTIFICATION_TOKEN_HASH_KEY_BASE64=compose-validation
            PLACE_SERVICE_TOKEN_SERVICE_SECRET=compose-validation
            POSTGRES_PASSWORD=compose-validation
            SUPPORT_SERVICE_TOKEN_SERVICE_SECRET=compose-validation
            USER_SERVICE_TOKEN_SERVICE_SECRET=compose-validation
          )
          env "${compose_validation_env[@]}" \
            docker compose \
              -f infra/test/docker-compose.test.yml \
              config --quiet

      - name: Validate required secrets
        shell: bash
        env:
          TEST_DEPLOY_HOST: ${{ vars.TEST_DEPLOY_HOST || secrets.TEST_DEPLOY_HOST || secrets.TEST_SERVER_HOST }}
          TEST_DEPLOY_USER: ${{ vars.TEST_DEPLOY_USER || secrets.TEST_DEPLOY_USER || secrets.TEST_SERVER_USER }}
          TEST_DEPLOY_PORT: ${{ vars.TEST_DEPLOY_PORT || secrets.TEST_DEPLOY_PORT || '22' }}
          TEST_DEPLOY_SSH_KEY: ${{ secrets.TEST_DEPLOY_SSH_KEY || secrets.TEST_SERVER_SSH_KEY }}
          TEST_DEPLOY_KNOWN_HOSTS: ${{ secrets.TEST_DEPLOY_KNOWN_HOSTS || secrets.TEST_SERVER_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          API_GATEWAY_TOKEN_SERVICE_SECRET: ${{ secrets.API_GATEWAY_TOKEN_SERVICE_SECRET }}
          AUTH_SERVICE_TOKEN_SERVICE_SECRET: ${{ secrets.AUTH_SERVICE_TOKEN_SERVICE_SECRET }}
          ACTIVITY_SERVICE_TOKEN_SERVICE_SECRET: ${{ secrets.ACTIVITY_SERVICE_TOKEN_SERVICE_SECRET }}
          EXCURSION_SERVICE_TOKEN_SERVICE_SECRET: ${{ secrets.EXCURSION_SERVICE_TOKEN_SERVICE_SECRET }}
          FEED_SERVICE_TOKEN_SERVICE_SECRET: ${{ secrets.FEED_SERVICE_TOKEN_SERVICE_SECRET }}
          GUIDE_SERVICE_TOKEN_SERVICE_SECRET: ${{ secrets.GUIDE_SERVICE_TOKEN_SERVICE_SECRET }}
          PLACE_SERVICE_TOKEN_SERVICE_SECRET: ${{ secrets.PLACE_SERVICE_TOKEN_SERVICE_SECRET }}
          SUPPORT_SERVICE_TOKEN_SERVICE_SECRET: ${{ secrets.SUPPORT_SERVICE_TOKEN_SERVICE_SECRET }}
          USER_SERVICE_TOKEN_SERVICE_SECRET: ${{ secrets.USER_SERVICE_TOKEN_SERVICE_SECRET }}
          TRANSLATION_PROVIDER: ${{ vars.TRANSLATION_PROVIDER || 'azure_translator' }}
          TRANSLATION_BILLING_MODE: ${{ vars.TRANSLATION_BILLING_MODE || 'free_only' }}
          TRANSLATION_MONTHLY_CHARACTER_LIMIT: ${{ vars.TRANSLATION_MONTHLY_CHARACTER_LIMIT || '2000000' }}
          TRANSLATION_QUOTA_WARNING_THRESHOLD: ${{ vars.TRANSLATION_QUOTA_WARNING_THRESHOLD || '0.80' }}
          TRANSLATION_QUOTA_CRITICAL_THRESHOLD: ${{ vars.TRANSLATION_QUOTA_CRITICAL_THRESHOLD || '0.95' }}
          AZURE_TRANSLATOR_ENDPOINT: ${{ vars.AZURE_TRANSLATOR_ENDPOINT || 'https://api.cognitive.microsofttranslator.com' }}
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ vars.AZURE_TRANSLATOR_REGION || '' }}
          AZURE_TRANSLATOR_TIMEOUT: ${{ vars.AZURE_TRANSLATOR_TIMEOUT || '5s' }}
          ACTIVITY_ASYNC_TRANSLATION_ENABLED: ${{ vars.ACTIVITY_ASYNC_TRANSLATION_ENABLED || 'true' }}
          ACTIVITY_TRANSLATION_WORKER_ENABLED: ${{ vars.ACTIVITY_TRANSLATION_WORKER_ENABLED || 'false' }}
          ACTIVITY_TRANSLATION_WORKER_BATCH_SIZE: ${{ vars.ACTIVITY_TRANSLATION_WORKER_BATCH_SIZE || '10' }}
          ACTIVITY_TRANSLATION_WORKER_INTERVAL: ${{ vars.ACTIVITY_TRANSLATION_WORKER_INTERVAL || '2s' }}
          ACTIVITY_TRANSLATION_MAX_ATTEMPTS: ${{ vars.ACTIVITY_TRANSLATION_MAX_ATTEMPTS || '5' }}
          ACTIVITY_TRANSLATION_RETRY_BASE_DELAY: ${{ vars.ACTIVITY_TRANSLATION_RETRY_BASE_DELAY || '30s' }}
          ACTIVITY_TRANSLATION_REQUEST_TIMEOUT: ${{ vars.ACTIVITY_TRANSLATION_REQUEST_TIMEOUT || '8s' }}
          ACTIVITY_TRANSLATION_LOCK_TIMEOUT: ${{ vars.ACTIVITY_TRANSLATION_LOCK_TIMEOUT || '2m' }}
          EXCURSION_ASYNC_TRANSLATION_ENABLED: ${{ vars.EXCURSION_ASYNC_TRANSLATION_ENABLED || 'true' }}
          EXCURSION_TRANSLATION_WORKER_ENABLED: ${{ vars.EXCURSION_TRANSLATION_WORKER_ENABLED || 'false' }}
          EXCURSION_TRANSLATION_WORKER_BATCH_SIZE: ${{ vars.EXCURSION_TRANSLATION_WORKER_BATCH_SIZE || '10' }}
          EXCURSION_TRANSLATION_WORKER_INTERVAL: ${{ vars.EXCURSION_TRANSLATION_WORKER_INTERVAL || '2s' }}
          EXCURSION_TRANSLATION_MAX_ATTEMPTS: ${{ vars.EXCURSION_TRANSLATION_MAX_ATTEMPTS || '5' }}
          EXCURSION_TRANSLATION_RETRY_BASE_DELAY: ${{ vars.EXCURSION_TRANSLATION_RETRY_BASE_DELAY || '30s' }}
          EXCURSION_TRANSLATION_REQUEST_TIMEOUT: ${{ vars.EXCURSION_TRANSLATION_REQUEST_TIMEOUT || '8s' }}
          EXCURSION_TRANSLATION_LOCK_TIMEOUT: ${{ vars.EXCURSION_TRANSLATION_LOCK_TIMEOUT || '2m' }}
          MTLS_MODE: ${{ vars.MTLS_MODE || 'enforce' }}
          MTLS_MIN_VERSION: ${{ vars.MTLS_MIN_VERSION || '1.3' }}
          MTLS_CERT_GROUP_ID: ${{ vars.MTLS_CERT_GROUP_ID || '1001' }}
          ADMIN_PANEL_MTLS_MODE: ${{ vars.ADMIN_PANEL_MTLS_MODE || '' }}
          ANTI_FRAUD_SERVICE_MTLS_MODE: ${{ vars.ANTI_FRAUD_SERVICE_MTLS_MODE || '' }}
          API_GATEWAY_MTLS_MODE: ${{ vars.API_GATEWAY_MTLS_MODE || '' }}
          ACTIVITY_SERVICE_MTLS_MODE: ${{ vars.ACTIVITY_SERVICE_MTLS_MODE || '' }}
          AUTH_SERVICE_MTLS_MODE: ${{ vars.AUTH_SERVICE_MTLS_MODE || '' }}
          CHAT_SERVICE_MTLS_MODE: ${{ vars.CHAT_SERVICE_MTLS_MODE || '' }}
          CHECKLIST_SERVICE_MTLS_MODE: ${{ vars.CHECKLIST_SERVICE_MTLS_MODE || '' }}
          CURRENCY_SERVICE_MTLS_MODE: ${{ vars.CURRENCY_SERVICE_MTLS_MODE || '' }}
          EXCURSION_SERVICE_MTLS_MODE: ${{ vars.EXCURSION_SERVICE_MTLS_MODE || '' }}
          FEED_SERVICE_MTLS_MODE: ${{ vars.FEED_SERVICE_MTLS_MODE || '' }}
          FILE_MANAGER_SERVICE_MTLS_MODE: ${{ vars.FILE_MANAGER_SERVICE_MTLS_MODE || '' }}
          GUIDE_SERVICE_MTLS_MODE: ${{ vars.GUIDE_SERVICE_MTLS_MODE || '' }}
          NOTIFICATION_SERVICE_MTLS_MODE: ${{ vars.NOTIFICATION_SERVICE_MTLS_MODE || '' }}
          PAYMENT_SERVICE_MTLS_MODE: ${{ vars.PAYMENT_SERVICE_MTLS_MODE || '' }}
          PLACE_SERVICE_MTLS_MODE: ${{ vars.PLACE_SERVICE_MTLS_MODE || '' }}
          REFERENCE_SERVICE_MTLS_MODE: ${{ vars.REFERENCE_SERVICE_MTLS_MODE || '' }}
          ROUTING_SERVICE_MTLS_MODE: ${{ vars.ROUTING_SERVICE_MTLS_MODE || '' }}
          SEARCH_SERVICE_MTLS_MODE: ${{ vars.SEARCH_SERVICE_MTLS_MODE || '' }}
          STICKER_SERVICE_MTLS_MODE: ${{ vars.STICKER_SERVICE_MTLS_MODE || '' }}
          SUPPORT_SERVICE_MTLS_MODE: ${{ vars.SUPPORT_SERVICE_MTLS_MODE || '' }}
          SWITCHES_SERVICE_MTLS_MODE: ${{ vars.SWITCHES_SERVICE_MTLS_MODE || '' }}
          TOKEN_SERVICE_MTLS_MODE: ${{ vars.TOKEN_SERVICE_MTLS_MODE || '' }}
          TRANSLATION_SERVICE_MTLS_MODE: ${{ vars.TRANSLATION_SERVICE_MTLS_MODE || '' }}
          TRUST_SERVICE_MTLS_MODE: ${{ vars.TRUST_SERVICE_MTLS_MODE || '' }}
          USER_ROUTE_SERVICE_MTLS_MODE: ${{ vars.USER_ROUTE_SERVICE_MTLS_MODE || '' }}
          USER_SERVICE_MTLS_MODE: ${{ vars.USER_SERVICE_MTLS_MODE || '' }}
          MTLS_SECRETS_DIR: ${{ vars.MTLS_SECRETS_DIR || '/opt/inflap/secrets/mtls' }}
          MTLS_CA_CERT_PATH: ${{ vars.MTLS_CA_CERT_PATH || '/opt/inflap/secrets/mtls/ca.crt' }}
          AUTH_SERVICE_INTERNAL_HTTP_TLS_PORT: ${{ vars.AUTH_SERVICE_INTERNAL_HTTP_TLS_PORT || '9482' }}
          AUTH_SERVICE_INTERNAL_HTTP_URL: ${{ vars.AUTH_SERVICE_INTERNAL_HTTP_URL || 'https://auth-service:9482' }}
          AUTH_SERVICE_MTLS_ALLOWED_SPIFFE_IDS: ${{ vars.AUTH_SERVICE_MTLS_ALLOWED_SPIFFE_IDS || 'spiffe://inflap/test/api-gateway' }}
          AUTH_SERVICE_MTLS_ALLOWED_DNS_NAMES: ${{ vars.AUTH_SERVICE_MTLS_ALLOWED_DNS_NAMES || 'api-gateway' }}
          ADMIN_PANEL_INTERNAL_HTTP_TLS_PORT: ${{ vars.ADMIN_PANEL_INTERNAL_HTTP_TLS_PORT || '9495' }}
          ADMIN_PANEL_INTERNAL_HTTP_URL: ${{ vars.ADMIN_PANEL_INTERNAL_HTTP_URL || 'https://admin-panel:9495' }}
          ADMIN_PANEL_MTLS_ALLOWED_SPIFFE_IDS: ${{ vars.ADMIN_PANEL_MTLS_ALLOWED_SPIFFE_IDS || 'spiffe://inflap/test/api-gateway' }}
          ADMIN_PANEL_MTLS_ALLOWED_DNS_NAMES: ${{ vars.ADMIN_PANEL_MTLS_ALLOWED_DNS_NAMES || 'api-gateway' }}
          ANTI_FRAUD_SERVICE_INTERNAL_HTTP_TLS_PORT: ${{ vars.ANTI_FRAUD_SERVICE_INTERNAL_HTTP_TLS_PORT || '9446' }}
          ANTI_FRAUD_SERVICE_INTERNAL_HTTP_URL: ${{ vars.ANTI_FRAUD_SERVICE_INTERNAL_HTTP_URL || 'https://anti-fraud-service:9446' }}
          ANTI_FRAUD_SERVICE_MTLS_ALLOWED_SPIFFE_IDS: ${{ vars.ANTI_FRAUD_SERVICE_MTLS_ALLOWED_SPIFFE_IDS || 'spiffe://inflap/test/activity-service,spiffe://inflap/test/admin-panel,spiffe://inflap/test/auth-service,spiffe://inflap/test/excursion-service,spiffe://inflap/test/file-manager-service,spiffe://inflap/test/guide-service,spiffe://inflap/test/payment-service' }}
          ANTI_FRAUD_SERVICE_MTLS_ALLOWED_DNS_NAMES: ${{ vars.ANTI_FRAUD_SERVICE_MTLS_ALLOWED_DNS_NAMES || 'activity-service,admin-panel,auth-service,excursion-service,file-manager-service,guide-service,payment-service' }}
          SWITCHES_SERVICE_INTERNAL_HTTP_TLS_PORT: ${{ vars.SWITCHES_SERVICE_INTERNAL_HTTP_TLS_PORT || '9447' }}
          SWITCHES_SERVICE_INTERNAL_HTTP_URL: ${{ vars.SWITCHES_SERVICE_INTERNAL_HTTP_URL || 'https://switches-service:9447' }}
          SWITCHES_SERVICE_MTLS_ALLOWED_SPIFFE_IDS: ${{ vars.SWITCHES_SERVICE_MTLS_ALLOWED_SPIFFE_IDS || 'spiffe://inflap/test/activity-service,spiffe://inflap/test/admin-panel,spiffe://inflap/test/auth-service,spiffe://inflap/test/chat-service,spiffe://inflap/test/currency-service,spiffe://inflap/test/excursion-service,spiffe://inflap/test/feed-service,spiffe://inflap/test/file-manager-service,spiffe://inflap/test/place-service,spiffe://inflap/test/user-service' }}
          SWITCHES_SERVICE_MTLS_ALLOWED_DNS_NAMES: ${{ vars.SWITCHES_SERVICE_MTLS_ALLOWED_DNS_NAMES || 'activity-service,admin-panel,auth-service,chat-service,currency-service,excursion-service,feed-service,file-manager-service,place-service,user-service' }}
          PAYMENT_SERVICE_INTERNAL_HTTP_TLS_PORT: ${{ vars.PAYMENT_SERVICE_INTERNAL_HTTP_TLS_PORT || '9441' }}
          PAYMENT_SERVICE_INTERNAL_HTTP_URL: ${{ vars.PAYMENT_SERVICE_INTERNAL_HTTP_URL || 'https://payment-service:9441' }}
          PAYMENT_SERVICE_MTLS_ALLOWED_SPIFFE_IDS: ${{ vars.PAYMENT_SERVICE_MTLS_ALLOWED_SPIFFE_IDS || 'spiffe://inflap/test/activity-service,spiffe://inflap/test/api-gateway,spiffe://inflap/test/excursion-service' }}
          PAYMENT_SERVICE_MTLS_ALLOWED_DNS_NAMES: ${{ vars.PAYMENT_SERVICE_MTLS_ALLOWED_DNS_NAMES || 'activity-service,api-gateway,excursion-service' }}
          NOTIFICATION_SERVICE_INTERNAL_HTTP_TLS_PORT: ${{ vars.NOTIFICATION_SERVICE_INTERNAL_HTTP_TLS_PORT || '9448' }}
          NOTIFICATION_SERVICE_INTERNAL_HTTP_URL: ${{ vars.NOTIFICATION_SERVICE_INTERNAL_HTTP_URL || 'https://notification-service:9448' }}
          NOTIFICATION_SERVICE_MTLS_ALLOWED_SPIFFE_IDS: ${{ vars.NOTIFICATION_SERVICE_MTLS_ALLOWED_SPIFFE_IDS || 'spiffe://inflap/test/activity-service,spiffe://inflap/test/admin-panel,spiffe://inflap/test/api-gateway,spiffe://inflap/test/chat-service,spiffe://inflap/test/checklist-service,spiffe://inflap/test/excursion-service,spiffe://inflap/test/feed-service,spiffe://inflap/test/support-service,spiffe://inflap/test/token-service' }}
          NOTIFICATION_SERVICE_MTLS_ALLOWED_DNS_NAMES: ${{ vars.NOTIFICATION_SERVICE_MTLS_ALLOWED_DNS_NAMES || 'activity-service,admin-panel,api-gateway,chat-service,checklist-service,excursion-service,feed-service,support-service,token-service' }}
          CHECKLIST_SERVICE_INTERNAL_HTTP_TLS_PORT: ${{ vars.CHECKLIST_SERVICE_INTERNAL_HTTP_TLS_PORT || '9499' }}
          CHECKLIST_SERVICE_INTERNAL_HTTP_URL: ${{ vars.CHECKLIST_SERVICE_INTERNAL_HTTP_URL || 'https://checklist-service:9499' }}
          CHECKLIST_SERVICE_MTLS_ALLOWED_SPIFFE_IDS: ${{ vars.CHECKLIST_SERVICE_MTLS_ALLOWED_SPIFFE_IDS || 'spiffe://inflap/test/api-gateway' }}
          CHECKLIST_SERVICE_MTLS_ALLOWED_DNS_NAMES: ${{ vars.CHECKLIST_SERVICE_MTLS_ALLOWED_DNS_NAMES || 'api-gateway' }}
          FEED_SERVICE_INTERNAL_HTTP_TLS_PORT: ${{ vars.FEED_SERVICE_INTERNAL_HTTP_TLS_PORT || '9487' }}
          FEED_SERVICE_INTERNAL_HTTP_URL: ${{ vars.FEED_SERVICE_INTERNAL_HTTP_URL || 'https://feed-service:9487' }}
          FEED_SERVICE_MTLS_ALLOWED_SPIFFE_IDS: ${{ vars.FEED_SERVICE_MTLS_ALLOWED_SPIFFE_IDS || 'spiffe://inflap/test/admin-panel,spiffe://inflap/test/api-gateway,spiffe://inflap/test/user-service' }}
          FEED_SERVICE_MTLS_ALLOWED_DNS_NAMES: ${{ vars.FEED_SERVICE_MTLS_ALLOWED_DNS_NAMES || 'admin-panel,api-gateway,user-service' }}
          EXCURSION_SERVICE_INTERNAL_HTTP_TLS_PORT: ${{ vars.EXCURSION_SERVICE_INTERNAL_HTTP_TLS_PORT || '9493' }}
          EXCURSION_SERVICE_INTERNAL_HTTP_URL: ${{ vars.EXCURSION_SERVICE_INTERNAL_HTTP_URL || 'https://excursion-service:9493' }}
          EXCURSION_SERVICE_MTLS_ALLOWED_SPIFFE_IDS: ${{ vars.EXCURSION_SERVICE_MTLS_ALLOWED_SPIFFE_IDS || 'spiffe://inflap/test/admin-panel,spiffe://inflap/test/api-gateway,spiffe://inflap/test/guide-service' }}
          EXCURSION_SERVICE_MTLS_ALLOWED_DNS_NAMES: ${{ vars.EXCURSION_SERVICE_MTLS_ALLOWED_DNS_NAMES || 'admin-panel,api-gateway,guide-service' }}
          PLACE_SERVICE_INTERNAL_HTTP_TLS_PORT: ${{ vars.PLACE_SERVICE_INTERNAL_HTTP_TLS_PORT || '9490' }}
          PLACE_SERVICE_INTERNAL_HTTP_URL: ${{ vars.PLACE_SERVICE_INTERNAL_HTTP_URL || 'https://place-service:9490' }}
          PLACE_SERVICE_MTLS_ALLOWED_SPIFFE_IDS: ${{ vars.PLACE_SERVICE_MTLS_ALLOWED_SPIFFE_IDS || 'spiffe://inflap/test/admin-panel,spiffe://inflap/test/api-gateway,spiffe://inflap/test/excursion-service' }}
          PLACE_SERVICE_MTLS_ALLOWED_DNS_NAMES: ${{ vars.PLACE_SERVICE_MTLS_ALLOWED_DNS_NAMES || 'admin-panel,api-gateway,excursion-service' }}
          SUPPORT_SERVICE_INTERNAL_HTTP_TLS_PORT: ${{ vars.SUPPORT_SERVICE_INTERNAL_HTTP_TLS_PORT || '9500' }}
