            ANTI_FRAUD_SERVICE_MTLS_ALLOWED_SPIFFE_IDS \
            ANTI_FRAUD_SERVICE_MTLS_ALLOWED_DNS_NAMES \
            SWITCHES_SERVICE_INTERNAL_HTTP_TLS_PORT \
            SWITCHES_SERVICE_INTERNAL_HTTP_URL \
            SWITCHES_SERVICE_MTLS_ALLOWED_SPIFFE_IDS \
