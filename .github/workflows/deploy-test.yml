            SEARCH_SERVICE_MTLS_ALLOWED_DNS_NAMES \
            TOKEN_SERVICE_INTERNAL_GRPC_TLS_PORT \
            TOKEN_SERVICE_INTERNAL_HTTP_TLS_PORT \
            TOKEN_SERVICE_INTERNAL_GRPC_TARGET \
            TOKEN_SERVICE_INTERNAL_JWKS_URL \
            TOKEN_SERVICE_MTLS_ALLOWED_SPIFFE_IDS \
            TOKEN_SERVICE_MTLS_ALLOWED_DNS_NAMES \
            TRUST_SERVICE_INTERNAL_GRPC_TLS_PORT \
            TRUST_SERVICE_INTERNAL_GRPC_TARGET \
            TRUST_SERVICE_MTLS_ALLOWED_SPIFFE_IDS \
            TRUST_SERVICE_MTLS_ALLOWED_DNS_NAMES \
            FILE_MANAGER_SERVICE_INTERNAL_HTTP_TLS_PORT \
            FILE_MANAGER_SERVICE_INTERNAL_HTTP_URL \
            FILE_MANAGER_SERVICE_INTERNAL_GRPC_TLS_PORT \
            FILE_MANAGER_SERVICE_INTERNAL_GRPC_TARGET \
            FILE_MANAGER_SERVICE_MTLS_ALLOWED_SPIFFE_IDS \
            FILE_MANAGER_SERVICE_MTLS_ALLOWED_DNS_NAMES \
            USER_SERVICE_INTERNAL_HTTP_TLS_PORT \
            USER_SERVICE_INTERNAL_HTTP_URL \
            USER_SERVICE_INTERNAL_GRPC_TLS_PORT \
            USER_SERVICE_INTERNAL_GRPC_TARGET \
            USER_SERVICE_MTLS_ALLOWED_SPIFFE_IDS \
            USER_SERVICE_MTLS_ALLOWED_DNS_NAMES
          do
            value="${!name:-}"
            if [[ -z "${value}" && "${name}" != "AZURE_TRANSLATOR_REGION" ]]; then
              continue
            fi
            if [[ "${value}" == *$'\n'* ]]; then
              echo "${name} must be a single-line value." >&2
              exit 1
            fi
            printf '%s=%s\n' "${name}" "${value}" >>"${runtime_env_file}"
          done

          if [[ -s "${runtime_env_file}" ]]; then
            scp "${ssh_opts[@]}" "${runtime_env_file}" \
              "${TEST_DEPLOY_USER}@${TEST_DEPLOY_HOST}:/tmp/inflap-test-runtime.env"
            ssh "${ssh_opts[@]}" "${TEST_DEPLOY_USER}@${TEST_DEPLOY_HOST}" \
              "set -e; mkdir -p /opt/inflap/env; umask 077; if [ -f /opt/inflap/env/runtime.env ]; then cp -p /opt/inflap/env/runtime.env /opt/inflap/env/runtime.env.previous; else rm -f /opt/inflap/env/runtime.env.previous; fi; mv /tmp/inflap-test-runtime.env /opt/inflap/env/runtime.env"
          fi

          ssh "${ssh_opts[@]}" "${TEST_DEPLOY_USER}@${TEST_DEPLOY_HOST}" \
            "REQUIRE_GHCR_AUTH=true IMAGE_REGISTRY='${IMAGE_REGISTRY}' IMAGE_NAMESPACE='${IMAGE_NAMESPACE}' IMAGE_PREFIX='${IMAGE_PREFIX}' IMAGE_TAG='${IMAGE_TAG}' MTLS_MODE='${MTLS_MODE}' MTLS_CERT_GROUP_ID='${MTLS_CERT_GROUP_ID}' MTLS_SECRETS_DIR='${MTLS_SECRETS_DIR}' MTLS_CA_CERT_PATH='${MTLS_CA_CERT_PATH}' /opt/inflap/scripts/deploy.sh"
