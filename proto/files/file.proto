syntax = "proto3";

package file.v1;

option go_package = "github.com/dkhvan-dev/flyfy/proto/gen/go/file/v1;filev1";

service FileService {
  rpc CreateUploadRequest(CreateUploadRequestRequest) returns (CreateUploadRequestResponse);
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  rpc GetFile(GetFileRequest) returns (GetFileResponse);
  rpc CreateDownloadUrl(CreateDownloadUrlRequest) returns (CreateDownloadUrlResponse);
  rpc SoftDeleteFile(SoftDeleteFileRequest) returns (SoftDeleteFileResponse);
  rpc BindFile(BindFileRequest) returns (BindFileResponse);
  rpc ListFileBindings(ListFileBindingsRequest) returns (ListFileBindingsResponse);
}

message CreateUploadRequestRequest {
  string original_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string purpose = 4;
  string visibility = 5;
  string owner_type = 6;
  string owner_id = 7;
  string uploaded_by_user_id = 8;
}

message CreateUploadRequestResponse {
  string file_id = 1;
  string object_key = 2;
  string status = 3;
  string upload_method = 4;
  string upload_url = 5;
  map<string, string> upload_headers = 6;
  string expires_at = 7;
}

message CompleteUploadRequest {
  string file_id = 1;
}

message CompleteUploadResponse {
  string file_id = 1;
  string status = 2;
  string detected_content_type = 3;
  int64 size_bytes = 4;
}

message GetFileRequest {
  string file_id = 1;
}

message GetFileResponse {
  string file_id = 1;
  string bucket = 2;
  string object_key = 3;
  string original_name = 4;
  string content_type = 5;
  string detected_content_type = 6;
  int64 size_bytes = 7;
  string purpose = 8;
  string visibility = 9;
  string status = 10;
  string owner_type = 11;
  string owner_id = 12;
}

message CreateDownloadUrlRequest {
  string file_id = 1;
}

message CreateDownloadUrlResponse {
  string url = 1;
  string expires_at = 2;
}

message SoftDeleteFileRequest {
  string file_id = 1;
}

message SoftDeleteFileResponse {
  bool success = 1;
}

message BindFileRequest {
  string file_id = 1;
  string owner_type = 2;
  string owner_id = 3;
  string purpose = 4;
  bool is_primary = 5;
  string created_by_user_id = 6;
}

message BindFileResponse {
  FileBinding binding = 1;
}

message ListFileBindingsRequest {
  string file_id = 1;
}

message ListFileBindingsResponse {
  repeated FileBinding bindings = 1;
}

message FileBinding {
  string id = 1;
  string file_id = 2;
  string owner_type = 3;
  string owner_id = 4;
  string purpose = 5;
  bool is_primary = 6;
  bool is_deleted = 7;
  string deleted_at = 8;
  string created_by_user_id = 9;
  string created_at = 10;
  string updated_at = 11;
}