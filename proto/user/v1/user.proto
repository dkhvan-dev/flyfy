syntax = "proto3";

package user.v1;

option go_package = "github.com/dkhvan-dev/flyfy/proto/gen/go/user/v1;userv1";

service UserService {
  rpc GetOrCreateUserBySubject(GetOrCreateUserBySubjectRequest) returns (GetOrCreateUserBySubjectResponse);
  rpc GetUserById(GetUserByIdRequest) returns (GetUserByIdResponse);
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);
  rpc UpdateUserProfile(UpdateUserProfileRequest) returns (UpdateUserProfileResponse);
  rpc UpdateUserSettings(UpdateUserSettingsRequest) returns (UpdateUserSettingsResponse);
  rpc GrantUserRole(GrantUserRoleRequest) returns (GrantUserRoleResponse);
  rpc ListPublicProfiles(ListPublicProfilesRequest) returns (ListPublicProfilesResponse);
  rpc GetPublicProfilesByUserIds(GetPublicProfilesByUserIdsRequest) returns (GetPublicProfilesByUserIdsResponse);
  rpc GetUserBySubject(GetUserBySubjectRequest) returns (GetUserBySubjectResponse);
}

message GetOrCreateUserBySubjectRequest {
  string subject_id = 1;
  string primary_phone = 2;
  string primary_email = 3;
}

message GetOrCreateUserBySubjectResponse {
  UserAggregate aggregate = 1;
}

message GetUserByIdRequest {
  string user_id = 1;
}

message GetUserByIdResponse {
  UserAggregate aggregate = 1;
}

message GetUserProfileRequest {
  string user_id = 1;
}

message GetUserProfileResponse {
  UserProfile profile = 1;
}

message UpdateUserProfileRequest {
  string user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string display_name = 4;
  string bio = 5;
  string birth_date = 6;     // YYYY-MM-DD
  string avatar_file_id = 7; // UUID
  string city_id = 8;        // UUID
  string country_code = 9;
  string locale = 10;
  string timezone = 11;
  string currency = 12;
  optional bool is_public = 13;
}

message UpdateUserProfileResponse {
  UserProfile profile = 1;
}

message UserAggregate {
  User user = 1;
  UserProfile profile = 2;
  UserSettings settings = 3;
  UserReputation reputation = 4;
  repeated string roles = 5;
}

message User {
  string id = 1;
  string auth_subject_id = 2;
  string status = 3;
  string primary_phone = 4;
  string primary_email = 5;
  bool is_deleted = 6;
  string deleted_at = 7;
  string created_at = 8;
  string updated_at = 9;
  string last_seen_at = 10;
}

message UserProfile {
  string user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string display_name = 4;
  string bio = 5;
  string birth_date = 6;
  string avatar_file_id = 7;
  string city_id = 8;
  string country_code = 9;
  string locale = 10;
  string timezone = 11;
  string currency = 12;
  bool is_public = 13;
  string created_at = 14;
  string updated_at = 15;
  bool is_online = 16;
  string last_seen_at = 17;
}

message UserSettings {
  string user_id = 1;
  bool notifications_push_enabled = 2;
  bool notifications_email_enabled = 3;
  bool notifications_sms_enabled = 4;
  bool marketing_enabled = 5;
  bool dark_mode_enabled = 6;
  string created_at = 7;
  string updated_at = 8;
}

message UserReputation {
  string user_id = 1;
  int32 trust_score = 2;
  int32 risk_score = 3;
  int32 completed_bookings = 4;
  int32 completed_activities = 5;
  int32 cancellations_count = 6;
  int32 reports_count = 7;
  string created_at = 8;
  string updated_at = 9;
}

message UpdateUserSettingsRequest {
  string user_id = 1;
  optional bool notifications_push_enabled = 2;
  optional bool notifications_email_enabled = 3;
  optional bool notifications_sms_enabled = 4;
  optional bool marketing_enabled = 5;
  optional bool dark_mode_enabled = 6;
}

message UpdateUserSettingsResponse {
  UserSettings settings = 1;
}

message GrantUserRoleRequest {
  string user_id = 1;
  string role = 2;
  string granted_by = 3;
}

message GrantUserRoleResponse {
  bool success = 1;
}

message ListPublicProfilesRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListPublicProfilesResponse {
  repeated PublicProfile items = 1;
}

message PublicProfile {
  string user_id = 1;
  string display_name = 2;
  string bio = 3;
  string avatar_file_id = 4;
  string country_code = 5;
  string locale = 6;
  string timezone = 7;
  bool is_public = 8;
  bool is_online = 9;
  string last_seen_at = 10;
}

message GetPublicProfilesByUserIdsRequest {
  repeated string user_ids = 1;
}

message GetPublicProfilesByUserIdsResponse {
  repeated PublicProfile items = 1;
}

message GetUserBySubjectRequest {
  string subject_id = 1;
}

message GetUserBySubjectResponse {
  UserAggregate aggregate = 1;
}
