syntax = "proto3";

package user.v1;

import "google/protobuf/timestamp.proto";

option go_package = "kz/inflap/proto/gen/go/user/v1;userv1";

service UserService {
  rpc GetOrCreateUserBySubject(GetOrCreateUserBySubjectRequest) returns (GetOrCreateUserBySubjectResponse);
  rpc GetUserById(GetUserByIdRequest) returns (GetUserByIdResponse);
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);
  rpc UpdateUserProfile(UpdateUserProfileRequest) returns (UpdateUserProfileResponse);
  rpc UpdateUserSettings(UpdateUserSettingsRequest) returns (UpdateUserSettingsResponse);
  rpc GrantUserRole(GrantUserRoleRequest) returns (GrantUserRoleResponse);
  rpc RevokeUserRole(RevokeUserRoleRequest) returns (RevokeUserRoleResponse);
  rpc ListPublicProfiles(ListPublicProfilesRequest) returns (ListPublicProfilesResponse);
  rpc GetPublicProfilesByUserIds(GetPublicProfilesByUserIdsRequest) returns (GetPublicProfilesByUserIdsResponse);
  rpc ListPublicUserIdsByCountryCodes(ListPublicUserIdsByCountryCodesRequest) returns (ListPublicUserIdsByCountryCodesResponse);
  rpc FilterFriendUserIds(FilterFriendUserIdsRequest) returns (FilterFriendUserIdsResponse);
  rpc FilterFollowingUserIds(FilterFollowingUserIdsRequest) returns (FilterFollowingUserIdsResponse);
  rpc ResolveUserByNickname(ResolveUserByNicknameRequest) returns (ResolveUserByNicknameResponse);
  rpc GetUserBySubject(GetUserBySubjectRequest) returns (GetUserBySubjectResponse);
  rpc ListAdminUsers(ListAdminUsersRequest) returns (ListAdminUsersResponse);
  rpc GetAdminUserDetail(GetAdminUserDetailRequest) returns (GetAdminUserDetailResponse);
}

message GetOrCreateUserBySubjectRequest {
  string subject_id = 1;
  string primary_phone = 2;
  string primary_email = 3;
}

message GetOrCreateUserBySubjectResponse {
  UserAggregate aggregate = 1;
}

message GetUserByIdRequest {
  string user_id = 1;
}

message GetUserByIdResponse {
  UserAggregate aggregate = 1;
}

message GetUserProfileRequest {
  string user_id = 1;
}

message GetUserProfileResponse {
  UserProfile profile = 1;
}

message UpdateUserProfileRequest {
  reserved 13;

  string user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string nickname = 4;
  string bio = 5;
  string birth_date = 6;     // YYYY-MM-DD
  string avatar_file_id = 7; // UUID
  string city_id = 8;        // UUID
  string country_code = 9;
  string locale = 10;
  string timezone = 11;
  string currency = 12;
}

message UpdateUserProfileResponse {
  UserProfile profile = 1;
}

message UserAggregate {
  User user = 1;
  UserProfile profile = 2;
  UserSettings settings = 3;
  UserReputation reputation = 4;
  repeated string roles = 5;
}

message User {
  string id = 1;
  string auth_subject_id = 2;
  string status = 3;
  string primary_phone = 4;
  string primary_email = 5;
  bool is_deleted = 6;
  string deleted_at = 7;
  string created_at = 8;
  string updated_at = 9;
  string last_seen_at = 10;
}

message UserProfile {
  reserved 13;

  string user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string nickname = 4;
  string bio = 5;
  string birth_date = 6;
  string avatar_file_id = 7;
  string city_id = 8;
  string country_code = 9;
  string locale = 10;
  string timezone = 11;
  string currency = 12;
  string created_at = 14;
  string updated_at = 15;
  bool is_online = 16;
  string last_seen_at = 17;
}

message UserSettings {
  string user_id = 1;
  bool notifications_push_enabled = 2;
  bool notifications_email_enabled = 3;
  bool notifications_sms_enabled = 4;
  bool marketing_enabled = 5;
  bool dark_mode_enabled = 6;
  string created_at = 7;
  string updated_at = 8;
}

message UserReputation {
  string user_id = 1;
  int32 trust_score = 2;
  int32 risk_score = 3;
  int32 completed_bookings = 4;
  int32 completed_activities = 5;
  int32 cancellations_count = 6;
  int32 reports_count = 7;
  string created_at = 8;
  string updated_at = 9;
}

message UpdateUserSettingsRequest {
  string user_id = 1;
  optional bool notifications_push_enabled = 2;
  optional bool notifications_email_enabled = 3;
  optional bool notifications_sms_enabled = 4;
  optional bool marketing_enabled = 5;
  optional bool dark_mode_enabled = 6;
}

message UpdateUserSettingsResponse {
  UserSettings settings = 1;
}

message GrantUserRoleRequest {
  string user_id = 1;
  string role = 2;
  string granted_by = 3;
}

message GrantUserRoleResponse {
  bool success = 1;
}

message RevokeUserRoleRequest {
  string user_id = 1;
  string role = 2;
}

message RevokeUserRoleResponse {
  bool success = 1;
}

message ListPublicProfilesRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListPublicProfilesResponse {
  repeated PublicProfile items = 1;
}

message PublicProfile {
  reserved 8;

  string user_id = 1;
  string nickname = 2;
  string bio = 3;
  string avatar_file_id = 4;
  string country_code = 5;
  string locale = 6;
  string timezone = 7;
  bool is_online = 9;
  string last_seen_at = 10;
  string first_name = 11;
  string last_name = 12;
}

message GetPublicProfilesByUserIdsRequest {
  repeated string user_ids = 1;
}

message GetPublicProfilesByUserIdsResponse {
  repeated PublicProfile items = 1;
}

message ListPublicUserIdsByCountryCodesRequest {
  repeated string country_codes = 1;
}

message ListPublicUserIdsByCountryCodesResponse {
  repeated string user_ids = 1;
}

message FilterFriendUserIdsRequest {
  string user_id = 1;
  repeated string candidate_user_ids = 2;
}

message FilterFriendUserIdsResponse {
  repeated string friend_user_ids = 1;
}

message FilterFollowingUserIdsRequest {
  string user_id = 1;
  repeated string candidate_user_ids = 2;
}

message FilterFollowingUserIdsResponse {
  repeated string following_user_ids = 1;
}

message ResolveUserByNicknameRequest {
  string nickname = 1;
}

message ResolveUserByNicknameResponse {
  // user_id is the user-service profile aggregate ID.
  string user_id = 1;
  // auth_subject_id is the auth-service subject ID used in access tokens.
  string auth_subject_id = 2;
}

message GetUserBySubjectRequest {
  string subject_id = 1;
}

message GetUserBySubjectResponse {
  UserAggregate aggregate = 1;
}

message ListAdminUsersRequest {
  int32 page_size = 1;
  string page_token = 2;
  string query = 3;
  string status = 4;
  string role = 5;
  string country_code = 6;
  google.protobuf.Timestamp created_from = 7;
  google.protobuf.Timestamp created_to = 8;
  google.protobuf.Timestamp last_active_from = 9;
  google.protobuf.Timestamp last_active_to = 10;
}

message AdminUserListItem {
  string user_id = 1;
  string nickname = 2;
  string masked_phone = 3;
  string masked_email = 4;
  string country_code = 5;
  repeated string roles = 6;
  string account_status = 7;
  string guide_status = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp last_active_at = 10;
}

message ListAdminUsersResponse {
  repeated AdminUserListItem users = 1;
  string next_page_token = 2;
}

message GetAdminUserDetailRequest {
  string user_id = 1;
}

message AdminUserDetail {
  string user_id = 1;
  string nickname = 2;
  string masked_phone = 3;
  string masked_email = 4;
  string country_code = 5;
  repeated string roles = 6;
  string account_status = 7;
  string guide_status = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp last_active_at = 11;
}

message GetAdminUserDetailResponse {
  AdminUserDetail user = 1;
}
