name: inflap-test

x-common-env: &common-env
  APP_ENV: test
  LOG_LEVEL: ${LOG_LEVEL:-info}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
  REQUEST_ID_HEADER: X-Request-Id
  TRUSTED_GATEWAY_HEADER_USER_ID: X-User-Id
  TRUSTED_GATEWAY_HEADER_ROLES: X-User-Roles
  TRUSTED_GATEWAY_HEADER_SUB: X-Auth-Subject
  TRUSTED_HEADER_USER_ID: X-User-Id
  TRUSTED_HEADER_ROLES: X-User-Roles
  TRUSTED_HEADER_SUB: X-Auth-Subject

x-mtls-admin-panel-volumes: &mtls-admin-panel-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/admin-panel:/opt/inflap/secrets/mtls/admin-panel:ro
x-mtls-anti-fraud-service-volumes: &mtls-anti-fraud-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/anti-fraud-service:/opt/inflap/secrets/mtls/anti-fraud-service:ro
x-mtls-api-gateway-volumes: &mtls-api-gateway-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/api-gateway:/opt/inflap/secrets/mtls/api-gateway:ro
x-mtls-activity-service-volumes: &mtls-activity-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/activity-service:/opt/inflap/secrets/mtls/activity-service:ro
x-mtls-auth-service-volumes: &mtls-auth-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/auth-service:/opt/inflap/secrets/mtls/auth-service:ro
x-mtls-chat-service-volumes: &mtls-chat-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/chat-service:/opt/inflap/secrets/mtls/chat-service:ro
x-mtls-checklist-service-volumes: &mtls-checklist-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/checklist-service:/opt/inflap/secrets/mtls/checklist-service:ro
x-mtls-currency-service-volumes: &mtls-currency-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/currency-service:/opt/inflap/secrets/mtls/currency-service:ro
x-mtls-excursion-service-volumes: &mtls-excursion-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/excursion-service:/opt/inflap/secrets/mtls/excursion-service:ro
x-mtls-feed-service-volumes: &mtls-feed-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/feed-service:/opt/inflap/secrets/mtls/feed-service:ro
x-mtls-file-manager-service-volumes: &mtls-file-manager-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/file-manager-service:/opt/inflap/secrets/mtls/file-manager-service:ro
x-mtls-guide-service-volumes: &mtls-guide-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/guide-service:/opt/inflap/secrets/mtls/guide-service:ro
x-mtls-notification-service-volumes: &mtls-notification-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/notification-service:/opt/inflap/secrets/mtls/notification-service:ro
x-mtls-payment-service-volumes: &mtls-payment-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/payment-service:/opt/inflap/secrets/mtls/payment-service:ro
x-mtls-place-service-volumes: &mtls-place-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/place-service:/opt/inflap/secrets/mtls/place-service:ro
x-mtls-reference-service-volumes: &mtls-reference-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/reference-service:/opt/inflap/secrets/mtls/reference-service:ro
x-mtls-routing-service-volumes: &mtls-routing-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/routing-service:/opt/inflap/secrets/mtls/routing-service:ro
x-mtls-search-service-volumes: &mtls-search-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/search-service:/opt/inflap/secrets/mtls/search-service:ro
x-mtls-sticker-service-volumes: &mtls-sticker-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/sticker-service:/opt/inflap/secrets/mtls/sticker-service:ro
x-mtls-support-service-volumes: &mtls-support-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/support-service:/opt/inflap/secrets/mtls/support-service:ro
x-mtls-switches-service-volumes: &mtls-switches-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/switches-service:/opt/inflap/secrets/mtls/switches-service:ro
x-mtls-token-service-volumes: &mtls-token-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/token-service:/opt/inflap/secrets/mtls/token-service:ro
x-mtls-translation-service-volumes: &mtls-translation-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/translation-service:/opt/inflap/secrets/mtls/translation-service:ro
x-mtls-trust-service-volumes: &mtls-trust-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/trust-service:/opt/inflap/secrets/mtls/trust-service:ro
x-mtls-user-route-service-volumes: &mtls-user-route-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/user-route-service:/opt/inflap/secrets/mtls/user-route-service:ro
x-mtls-user-service-volumes: &mtls-user-service-volumes
  - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/user-service:/opt/inflap/secrets/mtls/user-service:ro

x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_SSLMODE: disable
  POSTGRES_MAX_OPEN_CONNS: 8
  POSTGRES_MIN_OPEN_CONNS: 1

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: postgres
  DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  DB_SSLMODE: disable
  DB_MAX_CONNS: 8
  DB_MIN_CONNS: 1

x-pg-env: &pg-env
  PG_HOST: postgres
  PG_PORT: 5432
  PG_USER: postgres
  PG_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  PG_SSLMODE: disable
  PG_MAX_CONNS: 8

x-service-defaults: &service-defaults
  restart: unless-stopped
  group_add:
    - "${MTLS_CERT_GROUP_ID:-1001}"
  networks:
    - internal
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-image: &image
  IMAGE_REGISTRY: ${IMAGE_REGISTRY:-ghcr.io}
  IMAGE_NAMESPACE: ${IMAGE_NAMESPACE:-dkhvan-dev}
  IMAGE_PREFIX: ${IMAGE_PREFIX:-inflap-}
  IMAGE_TAG: ${IMAGE_TAG:-test-latest}

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TEST_API_HOST: ${TEST_API_HOST:-test-api.inflap.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
      - internal
    depends_on:
      api-gateway:
        condition: service_started

  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      INFLAP_POSTGRES_DATABASES: ${INFLAP_POSTGRES_DATABASES:-auth_db token_service_db user_service_db guide_service_db file_manager_service_db activity_service_db excursion_service_db feed_service_db chat_service_db notification_service_db payment_service_db place_service_db sticker_service_db checklist_service_db switches_service_db trust_service_db anti_fraud_service_db support_service_db admin_panel_db user_route_service_db search_service_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-inflap_test_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  minio-mc:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-inflap_test_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-inflap-test}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc version enable "local/$${MINIO_BUCKET}"
    networks:
      - internal
    restart: "no"

  api-gateway:
    <<: *service-defaults
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-dkhvan-dev}/${IMAGE_PREFIX:-inflap-}api-gateway:${IMAGE_TAG:-test-latest}
    volumes: *mtls-api-gateway-volumes
    environment:
      <<: *common-env
      MTLS_MODE: ${API_GATEWAY_MTLS_MODE:-${MTLS_MODE:-disabled}}
      MTLS_MIN_VERSION: ${MTLS_MIN_VERSION:-1.3}
      MTLS_CA_CERT_PATH: /opt/inflap/secrets/mtls/api-gateway/ca.crt
      HTTP_PORT: 8080
      REDIS_ADDR: redis:6379
      REDIS_CACHE_DB: 3
      TOKEN_SERVICE_GRPC_TARGET: ${TOKEN_SERVICE_INTERNAL_GRPC_TARGET:-dns:///token-service:50051}
      TOKEN_SERVICE_ID: api-gateway
      TOKEN_SERVICE_SECRET: ${API_GATEWAY_TOKEN_SERVICE_SECRET:?API_GATEWAY_TOKEN_SERVICE_SECRET is required}
      MTLS_CLIENT_CERT_PATH: /opt/inflap/secrets/mtls/api-gateway/client.crt
      MTLS_CLIENT_KEY_PATH: /opt/inflap/secrets/mtls/api-gateway/client.key
      TRUST_SERVICE_GRPC_TARGET: ${TRUST_SERVICE_INTERNAL_GRPC_TARGET:-dns:///trust-service:9096}
      AUTH_SERVICE_HTTP_URL: ${AUTH_SERVICE_INTERNAL_HTTP_URL:-http://auth-service:8082}
      USER_SERVICE_HTTP_URL: ${USER_SERVICE_INTERNAL_HTTP_URL:-http://user-service:8084}
      GUIDE_SERVICE_HTTP_URL: ${GUIDE_SERVICE_INTERNAL_HTTP_URL:-http://guide-service:8085}
      FILE_MANAGER_HTTP_URL: ${FILE_MANAGER_SERVICE_INTERNAL_HTTP_URL:-http://file-manager-service:8083}
      ACTIVITY_SERVICE_HTTP_URL: ${ACTIVITY_SERVICE_INTERNAL_HTTP_URL:-http://activity-service:8086}
      EXCURSION_SERVICE_HTTP_URL: ${EXCURSION_SERVICE_INTERNAL_HTTP_URL:-http://excursion-service:8093}
      FEED_SERVICE_HTTP_URL: ${FEED_SERVICE_INTERNAL_HTTP_URL:-http://feed-service:8087}
      CHAT_SERVICE_HTTP_URL: ${CHAT_SERVICE_INTERNAL_HTTP_URL:-http://chat-service:8088}
      REFERENCE_SERVICE_HTTP_URL: ${REFERENCE_SERVICE_INTERNAL_HTTP_URL:-http://reference-service:8089}
      CHECKLIST_SERVICE_HTTP_URL: ${CHECKLIST_SERVICE_INTERNAL_HTTP_URL:-http://checklist-service:8099}
      CURRENCY_SERVICE_HTTP_URL: ${CURRENCY_SERVICE_INTERNAL_HTTP_URL:-http://currency-service:8098}
      PLACE_SERVICE_HTTP_URL: ${PLACE_SERVICE_INTERNAL_HTTP_URL:-http://place-service:8090}
      ROUTING_SERVICE_HTTP_URL: ${ROUTING_SERVICE_INTERNAL_HTTP_URL:-http://routing-service:8094}
      USER_ROUTE_SERVICE_HTTP_URL: ${USER_ROUTE_SERVICE_INTERNAL_HTTP_URL:-http://user-route-service:8096}
      PAYMENT_SERVICE_HTTP_URL: ${PAYMENT_SERVICE_INTERNAL_HTTP_URL:-http://payment-service:8091}
      STICKER_SERVICE_HTTP_URL: ${STICKER_SERVICE_INTERNAL_HTTP_URL:-http://sticker-service:8092}
      NOTIFICATION_SERVICE_HTTP_URL: ${NOTIFICATION_SERVICE_INTERNAL_HTTP_URL:-http://notification-service:8097}
      SUPPORT_SERVICE_HTTP_URL: ${SUPPORT_SERVICE_INTERNAL_HTTP_URL:-http://support-service:8100}
      SEARCH_SERVICE_HTTP_URL: ${SEARCH_SERVICE_INTERNAL_HTTP_URL:-http://search-service:8101}
      ADMIN_PANEL_SERVICE_HTTP_URL: ${ADMIN_PANEL_INTERNAL_HTTP_URL:-http://admin-panel:8095}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      auth-service:
        condition: service_started
      token-service:
        condition: service_started
      user-service:
        condition: service_started
      trust-service:
        condition: service_started
      search-service:
        condition: service_started
      redis:
        condition: service_healthy

  token-service:
    <<: *service-defaults
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-dkhvan-dev}/${IMAGE_PREFIX:-inflap-}token-service:${IMAGE_TAG:-test-latest}
    environment:
      <<: [*common-env, *pg-env]
      MTLS_MODE: ${TOKEN_SERVICE_MTLS_MODE:-${MTLS_MODE:-disabled}}
      MTLS_MIN_VERSION: ${MTLS_MIN_VERSION:-1.3}
      MTLS_CA_CERT_PATH: /opt/inflap/secrets/mtls/token-service/ca.crt
      HTTP_PORT: 8081
      GRPC_PORT: 50051
      INTERNAL_GRPC_TLS_PORT: ${TOKEN_SERVICE_INTERNAL_GRPC_TLS_PORT:-0}
      INTERNAL_HTTP_TLS_PORT: ${TOKEN_SERVICE_INTERNAL_HTTP_TLS_PORT:-0}
      MTLS_SERVER_CERT_PATH: /opt/inflap/secrets/mtls/token-service/server.crt
      MTLS_SERVER_KEY_PATH: /opt/inflap/secrets/mtls/token-service/server.key
      MTLS_CLIENT_CERT_PATH: /opt/inflap/secrets/mtls/token-service/client.crt
      MTLS_CLIENT_KEY_PATH: /opt/inflap/secrets/mtls/token-service/client.key
      MTLS_ALLOWED_SPIFFE_IDS: ${TOKEN_SERVICE_MTLS_ALLOWED_SPIFFE_IDS:-spiffe://inflap/test/activity-service,spiffe://inflap/test/api-gateway,spiffe://inflap/test/auth-service,spiffe://inflap/test/excursion-service,spiffe://inflap/test/feed-service,spiffe://inflap/test/guide-service,spiffe://inflap/test/place-service,spiffe://inflap/test/search-service,spiffe://inflap/test/support-service,spiffe://inflap/test/user-service}
      MTLS_ALLOWED_DNS_NAMES: ${TOKEN_SERVICE_MTLS_ALLOWED_DNS_NAMES:-activity-service,api-gateway,auth-service,excursion-service,feed-service,guide-service,place-service,search-service,support-service,user-service}
      PG_DBNAME: token_service_db
      REDIS_ADDR: redis:6379
      REDIS_DB: 0
      JWT_ISSUER: inflap/test-token-service
      JWT_ACCESS_TTL: 30m
      JWT_REFRESH_TTL: 720h
      JWT_SERVICE_TTL: 1h
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/var/lib/inflap/token-service/signing-keys.json}
      NOTIFICATION_SERVICE_HTTP_URL: ${NOTIFICATION_SERVICE_INTERNAL_HTTP_URL:-http://notification-service:8097}
      NOTIFICATION_INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    volumes:
      - ${MTLS_SECRETS_DIR:-/opt/inflap/secrets/mtls}/token-service:/opt/inflap/secrets/mtls/token-service:ro
      - token_service_keys:/var/lib/inflap/token-service

  auth-service:
    <<: *service-defaults
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-dkhvan-dev}/${IMAGE_PREFIX:-inflap-}auth-service:${IMAGE_TAG:-test-latest}
    volumes: *mtls-auth-service-volumes
    networks:
      - internal
      - egress
    environment:
      <<: [*common-env, *pg-env]
      MTLS_MODE: ${AUTH_SERVICE_MTLS_MODE:-${MTLS_MODE:-disabled}}
      MTLS_MIN_VERSION: ${MTLS_MIN_VERSION:-1.3}
      MTLS_CA_CERT_PATH: /opt/inflap/secrets/mtls/auth-service/ca.crt
      HTTP_PORT: 8082
      INTERNAL_HTTP_TLS_PORT: ${AUTH_SERVICE_INTERNAL_HTTP_TLS_PORT:-0}
      PG_DBNAME: auth_db
      REDIS_ADDR: redis:6379
      REDIS_DB: 1
      TOKEN_SERVICE_ADDR: ${TOKEN_SERVICE_INTERNAL_GRPC_TARGET:-dns:///token-service:50051}
      TOKEN_SERVICE_ID: auth-service
      TOKEN_SERVICE_SECRET: ${AUTH_SERVICE_TOKEN_SERVICE_SECRET:?AUTH_SERVICE_TOKEN_SERVICE_SECRET is required}
      USER_SERVICE_GRPC_TARGET: ${USER_SERVICE_INTERNAL_GRPC_TARGET:-dns:///user-service:9094}
      USER_SERVICE_INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      ANTI_FRAUD_ENABLED: ${ANTI_FRAUD_ENABLED:-false}
      ANTI_FRAUD_BASE_URL: ${ANTI_FRAUD_SERVICE_INTERNAL_HTTP_URL:-http://anti-fraud-service:8096}
      ANTI_FRAUD_INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      ANTI_FRAUD_SIGNAL_HASH_KEY: ${ANTI_FRAUD_SIGNAL_HASH_KEY:-test-anti-fraud-signal-hash-key}
      ANTI_FRAUD_TIMEOUT: 800ms
      MTLS_SERVER_CERT_PATH: /opt/inflap/secrets/mtls/auth-service/server.crt
      MTLS_SERVER_KEY_PATH: /opt/inflap/secrets/mtls/auth-service/server.key
      MTLS_CLIENT_CERT_PATH: /opt/inflap/secrets/mtls/auth-service/client.crt
      MTLS_CLIENT_KEY_PATH: /opt/inflap/secrets/mtls/auth-service/client.key
      MTLS_ALLOWED_SPIFFE_IDS: ${AUTH_SERVICE_MTLS_ALLOWED_SPIFFE_IDS:-spiffe://inflap/test/api-gateway}
      MTLS_ALLOWED_DNS_NAMES: ${AUTH_SERVICE_MTLS_ALLOWED_DNS_NAMES:-api-gateway}
      SWITCHES_SERVICE_URL: ${SWITCHES_SERVICE_INTERNAL_HTTP_URL:-http://switches-service:8096}
      SWITCHES_INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      AUTH_TEST_OTP_BYPASS_ENABLED: ${AUTH_TEST_OTP_BYPASS_ENABLED:-false}
      AUTH_TEST_OTP_BYPASS_PHONES: ${AUTH_TEST_OTP_BYPASS_PHONES:-}
      AUTH_TEST_OTP_BYPASS_CODE: ${AUTH_TEST_OTP_BYPASS_CODE:-}
      EMAIL_OTP_FROM_ADDRESS: "${EMAIL_OTP_FROM_ADDRESS:-Inflap dkhvan.developer@gmail.com}"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_BASE_URL: ${RESEND_BASE_URL:-https://api.resend.com}
      RESEND_TIMEOUT: ${RESEND_TIMEOUT:-8s}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      switches-service:
        condition: service_started

  user-service:
    <<: *service-defaults
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-dkhvan-dev}/${IMAGE_PREFIX:-inflap-}user-service:${IMAGE_TAG:-test-latest}
    volumes: *mtls-user-service-volumes
    environment:
      <<: [*common-env, *postgres-env]
      MTLS_MODE: ${USER_SERVICE_MTLS_MODE:-${MTLS_MODE:-disabled}}
      MTLS_MIN_VERSION: ${MTLS_MIN_VERSION:-1.3}
      MTLS_CA_CERT_PATH: /opt/inflap/secrets/mtls/user-service/ca.crt
      HTTP_PORT: 8084
      INTERNAL_HTTP_TLS_PORT: ${USER_SERVICE_INTERNAL_HTTP_TLS_PORT:-0}
      GRPC_PORT: 9094
      INTERNAL_GRPC_TLS_PORT: ${USER_SERVICE_INTERNAL_GRPC_TLS_PORT:-0}
      POSTGRES_DB: user_service_db
      FILE_MANAGER_GRPC_TARGET: ${FILE_MANAGER_SERVICE_INTERNAL_GRPC_TARGET:-dns:///file-manager-service:9093}
      FEED_SERVICE_HTTP_URL: ${FEED_SERVICE_INTERNAL_HTTP_URL:-http://feed-service:8087}
      SWITCHES_SERVICE_URL: ${SWITCHES_SERVICE_INTERNAL_HTTP_URL:-http://switches-service:8096}
      SWITCHES_INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      SEARCH_INDEXING_ENABLED: "true"
      SEARCH_SERVICE_HTTP_URL: ${SEARCH_SERVICE_INTERNAL_HTTP_URL:-http://search-service:8101}
      SEARCH_SERVICE_TIMEOUT: 800ms
      MTLS_SERVER_CERT_PATH: /opt/inflap/secrets/mtls/user-service/server.crt
      MTLS_SERVER_KEY_PATH: /opt/inflap/secrets/mtls/user-service/server.key
      MTLS_CLIENT_CERT_PATH: /opt/inflap/secrets/mtls/user-service/client.crt
      MTLS_CLIENT_KEY_PATH: /opt/inflap/secrets/mtls/user-service/client.key
      MTLS_ALLOWED_SPIFFE_IDS: ${USER_SERVICE_MTLS_ALLOWED_SPIFFE_IDS:-spiffe://inflap/test/admin-panel,spiffe://inflap/test/activity-service,spiffe://inflap/test/api-gateway,spiffe://inflap/test/auth-service,spiffe://inflap/test/chat-service,spiffe://inflap/test/excursion-service,spiffe://inflap/test/feed-service,spiffe://inflap/test/guide-service,spiffe://inflap/test/place-service,spiffe://inflap/test/support-service}
      MTLS_ALLOWED_DNS_NAMES: ${USER_SERVICE_MTLS_ALLOWED_DNS_NAMES:-admin-panel,activity-service,api-gateway,auth-service,chat-service,excursion-service,feed-service,guide-service,place-service,support-service}
