{{define "auth/change_password"}}
{{template "pageStart" .}}
<section class="section narrow">
  <p class="eyebrow">{{t .Locale "security.account"}}</p>
  <h1>{{t .Locale "password.changeTitle"}}</h1>
  <form method="post" action="/admin/password/change" class="form card">
    {{csrfField .CSRFToken}}
    {{if and .Staff (not .Staff.RequiresPasswordChange)}}
    <label>
      <span>{{t .Locale "field.currentPassword"}}</span>
      <input name="current_password" type="password" autocomplete="current-password" required>
    </label>
    {{end}}
    <label>
      <span>{{t .Locale "field.newPassword"}}</span>
      <input name="password" type="password" autocomplete="new-password" minlength="12" required>
    </label>
    <label>
      <span>{{t .Locale "field.confirmPassword"}}</span>
      <input name="confirm_password" type="password" autocomplete="new-password" minlength="12" required>
    </label>
    <button class="primary" type="submit">{{t .Locale "action.updatePassword"}}</button>
  </form>
</section>
{{template "pageEnd" .}}
{{end}}
